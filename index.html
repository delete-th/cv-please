<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>CV Please</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@400;600&display=swap">
<style id="page-style">/* Layout: a passport opens the visit. Then a booth across the top and a wooden desk below, pinned while scrolling builds the booth and unpacks the applicant file. The entry record prints below the desk. A plain list view holds the same content in reading order. */
:root {
  color-scheme: light;
  --paper: #ebe5d4;
  --paper-deep: #dfd7c1;
  --field: #f6f2e6;
  --ink: #22201b;
  --ink-soft: #575246;
  --rule: #a99f88;
  --stamp-red: #a23226;
  --red-dark: #74231b;
  --stamp-green: #33654a;
  --green-light: #5f8f72;
  --booth: #4d5144;
  --booth-dark: #2f3329;
  --booth-light: #979d87;
  --cover: #2e4939;
  --cover-edge: #223629;
  --cover-ink: #dcc98e;
  --gold-dark: #a8914f;
  --manila: #d6c08c;
  --manila-deep: #bfa66f;
  --wood-1: #2a2018;
  --wood-2: #3a2c20;
  --wood-3: #5e4631;
  --wood-4: #b08a62;
  --wood-5: #dcbd96;
  --on-desk: #ece6d6;
  --shade: rgba(20, 15, 10, 0.5);
  --pool-1: rgba(220, 201, 142, 0.2);
  --pool-2: rgba(220, 201, 142, 0.12);
  --pool-3: rgba(220, 201, 142, 0.06);
  --tape: rgba(240, 232, 200, 0.72);
  --mark-ip: #e9bdb2;
  --mark-domain: #bcd8c5;
  --mark-hash: #e8d795;
  --pixel: "Pixelify Sans", "IBM Plex Mono", ui-monospace, monospace;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --px: 3px;
  --lift: 8px;
  --s1: 13px; --s2: 15px; --s3: 17px; --s4: 22px; --s5: 30px; --s6: clamp(40px, 7vw, 64px);
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
*, *::before, *::after { font-variant-ligatures: none !important; }
body { background: var(--paper); color: var(--ink); font: var(--s3)/1.6 var(--sans); }
html.locked, html.locked body { overflow: hidden; }
a { color: inherit; text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--stamp-green); outline-offset: 3px; }
.intro :focus-visible, .booth :focus-visible, .rack :focus-visible, .pill :focus-visible, .counter :focus-visible, .drawer-front :focus-visible, .unpack-hint :focus-visible { outline-color: var(--cover-ink); }
#hello:focus { outline: none; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding-left: 1.1em; }
.spr { display: block; image-rendering: pixelated; flex: none; }
.scroll-x { overflow-x: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* buttons: one loud, the rest quiet */
.btn-main { padding: 10px 20px 9px; border: 0; border-bottom: 4px solid var(--shade); background: var(--stamp-green); color: var(--on-desk); font: 600 var(--s3)/1.2 var(--pixel); letter-spacing: 0.03em; }
.btn-main:active { translate: 0 2px; border-bottom-width: 2px; }
.btn-main:disabled { opacity: 0.5; cursor: default; }
.btn-quiet { padding: 4px 2px; border: 0; background: none; font: 400 var(--s2)/1.2 var(--pixel); text-decoration: underline; text-underline-offset: 4px; }
.btn-quiet:disabled { opacity: 0.5; cursor: default; }

/* ink stamps with a worn pixel edge */
.ink { position: relative; display: inline-block; padding: 8px 13px 6px; font: 600 var(--s2)/1.15 var(--pixel); letter-spacing: 0.04em; rotate: var(--tilt, -3deg); }
.ink::before { content: ""; position: absolute; inset: 0; border: var(--px) solid currentColor; -webkit-mask-image: var(--worn); mask-image: var(--worn); -webkit-mask-size: var(--worn-size); mask-size: var(--worn-size); -webkit-mask-position: var(--mx, 0) var(--my, 0); mask-position: var(--mx, 0) var(--my, 0); }
.ink.red { color: var(--stamp-red); }
.ink.green { color: var(--stamp-green); }
.ink small { display: block; font: 400 11px/1.3 var(--mono); letter-spacing: 0; }
.thud { animation: thud 0.16s steps(2) both; }
@keyframes thud { from { opacity: 0; scale: 1.5; } }

/* ---------- the stamp ---------- */
.stampable { position: relative; }
.target { display: grid; place-items: center; width: 210px; max-width: 100%; height: 74px; border: 2px dashed var(--rule); background: none; color: var(--ink-soft); font: 400 var(--s1)/1.3 var(--mono); }
.marks { position: absolute; inset: 0; pointer-events: none; }
.mark { position: absolute; translate: -50% -50%; white-space: nowrap; font-size: var(--s3); }
.rack { position: fixed; right: var(--gut-r); bottom: calc(16px + var(--safe-b)); z-index: 70; display: none; gap: 4px; align-items: flex-end; padding: 6px 8px 4px; background: var(--booth-dark); border: var(--px) solid var(--ink); box-shadow: var(--px) var(--px) 0 var(--shade); }
html.desk-mode .rack, html.locked .rack { display: flex; }
.rack-stamp { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 0 2px; border: 0; background: none; color: var(--on-desk); font: 400 12px/1.2 var(--pixel); }
.rack-stamp[aria-pressed="true"] .spr { opacity: 0.2; }
.ghost { position: fixed; z-index: 80; left: 0; top: 0; pointer-events: none; }
.ghost.lift { translate: 0 -10px; }
.ghost.slam { translate: 0 3px; }
.preview { position: fixed; z-index: 75; left: 0; top: 0; translate: -50% -50%; rotate: 0deg; pointer-events: none; opacity: 0.25; font-size: var(--s3); white-space: nowrap; }
@media (hover: hover) and (pointer: fine) {
  html.holding, html.holding * { cursor: none !important; }
}

/* ---------- intro: passport on the desk ---------- */
.intro { position: fixed; inset: 0; z-index: 50; overflow: auto; display: grid; place-items: center; background: var(--wood-2) var(--wood-tile); background-size: var(--wood-size); image-rendering: pixelated; color: var(--on-desk); transition: opacity 0.6s ease; padding: 24px var(--gut-r) 96px var(--gut-l); }
.intro.leaving { opacity: 0; pointer-events: none; }
.intro-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; width: min(450px, 100%); }
.intro-say { min-height: 2.8em; font: 400 var(--s3)/1.4 var(--pixel); text-align: center; }
.passport { position: relative; width: 100%; perspective: 1600px; transition: translate 0.9s ease; }
.passport.open { translate: 0 50%; }
.intro-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; transition: translate 0.9s ease; }
.passport.open ~ .intro-actions { translate: 0 calc(var(--pp-h, 300px) / 2); }
.pp-data { min-height: 300px; padding: 14px 16px 12px; background: var(--paper-deep); color: var(--ink); box-shadow: var(--px) var(--px) 0 var(--shade); }
.pp-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font: 600 var(--s2) var(--pixel); }
.pp-head span:last-child { font: 400 var(--s1) var(--mono); }
.pp-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; }
.pp-photo { align-self: start; border: var(--px) solid var(--ink); background: var(--field); }
.pp-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; align-content: start; }
.pp-fields div.wide, .id-fields div.wide { grid-column: 1 / -1; }
.pp-fields dt, .id-fields dt { font: 400 11px/1.3 var(--mono); color: var(--ink-soft); }
.pp-fields dd, .id-fields dd { font: 600 var(--s2)/1.25 var(--pixel); overflow-wrap: anywhere; }
.pp-mrz { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--rule); font: 400 12px/1.5 var(--mono); letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; }
.pp-cover { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 0; transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1); }
.passport.open .pp-cover { transform: rotateX(180deg); }
.pp-front, .pp-back { position: absolute; inset: 0; backface-visibility: hidden; }
.pp-front { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--cover); border: var(--px) solid var(--cover-edge); color: var(--cover-ink); box-shadow: var(--px) var(--px) 0 var(--shade); cursor: pointer; }
.pp-front b { font: 600 var(--s5)/1 var(--pixel); letter-spacing: 0.08em; }
.pp-front span { font: 400 var(--s2)/1 var(--pixel); }
.pp-back { transform: rotateX(180deg); background: var(--paper-deep); color: var(--ink); border-bottom: 1px dashed var(--rule); }
.visa-page { height: 100%; padding: 14px 16px; }
.visa-page h2 { font: 600 var(--s2) var(--pixel); }
.visa-page .note { margin-top: 2px; font: 400 var(--s1)/1.4 var(--mono); color: var(--ink-soft); }
.visa { display: flex; flex-direction: column; }
.visa .target { margin: auto; }
.pp-stamps { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin-top: 12px; }

/* page turning */
.corner { position: absolute; right: 0; bottom: 0; z-index: 3; padding: 0; border: 0; background: none; }
.corner .spr { width: 18px; height: 18px; transition: width 0.12s steps(2), height 0.12s steps(2); }
.corner:hover .spr, .corner:focus-visible .spr, .paper:hover > .corner .spr, .pp-back:hover .corner .spr { width: 30px; height: 30px; }
.flip-out { animation: flipout 0.09s steps(2) forwards; }
.flip-in { animation: flipin 0.09s steps(2); }
@keyframes flipout { to { scale: 0.08 1; } }
@keyframes flipin { from { scale: 0.08 1; } }

/* ---------- scene: booth and desk, pinned while scrolling ---------- */
html.desk-mode body { background: var(--paper); }
.scene { position: relative; }
.stage { position: sticky; top: 0; display: flex; flex-direction: column; overflow: hidden; }

.booth { position: relative; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 26px; align-items: start; padding: 14px var(--gut-r) 14px var(--gut-l); background: var(--booth-dark); color: var(--on-desk); border-bottom: var(--px) solid var(--ink); }
.window-wrap { position: relative; overflow: hidden; border: var(--px) solid var(--ink); background: var(--booth); }
.window { padding: 6px; }
.board { display: flex; gap: 1px; margin-top: 6px; }
.tile { display: inline-grid; place-items: center; width: 13px; height: 22px; background: var(--booth-dark); color: var(--cover-ink); font: 600 14px/1 var(--pixel); background-image: linear-gradient(transparent 10px, var(--ink) 10px 11px, transparent 11px); }
.shutter { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: repeating-linear-gradient(var(--booth-light) 0 9px, var(--booth) 9px 12px); border-bottom: 6px solid var(--ink); color: var(--ink); font: 600 var(--s2) var(--pixel); }
.shutter span { padding: 2px 8px; background: var(--paper-deep); }
.shutter .btn-quiet { padding: 2px 8px; background: var(--paper-deep); }
.shutter.up { visibility: hidden; }
.hello { min-width: 0; }
.hello h1 { font: 600 clamp(28px, 3.6vw, 42px)/1.1 var(--sans); letter-spacing: -0.01em; }
.hello .tagline { margin-top: 4px; max-width: 50ch; font-size: var(--s2); line-height: 1.45; }
.denied-note { margin-top: 6px; font: 400 var(--s2)/1.4 var(--pixel); color: var(--cover-ink); }
.booth-links, .ask { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; margin-top: 10px; }
.bubble { margin-top: 8px; max-width: 56ch; padding: 8px 12px; background: var(--paper); color: var(--ink); font-size: var(--s2); }
.booth-side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; text-align: right; }
.clock { font: 600 var(--s4)/1 var(--pixel); color: var(--cover-ink); }
.radio { display: flex; gap: 8px; align-items: center; }
.aside { position: absolute; right: var(--gut-r); top: calc(100% + 8px); z-index: 30; max-width: 280px; padding: 8px 12px; background: var(--paper); color: var(--ink); font-size: var(--s2); line-height: 1.45; box-shadow: var(--px) var(--px) 0 var(--shade); pointer-events: none; }
.owner { display: inline-flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.owner .note { font-size: var(--s1); }
.owner .btn-main { padding: 6px 12px 5px; font-size: var(--s2); border-bottom-width: 3px; }

.desk { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--wood-2) var(--wood-tile); background-size: var(--wood-size); image-rendering: pixelated; color: var(--on-desk); }
.counter { position: absolute; z-index: 4; left: 0; right: 0; top: 0; height: 46px; display: flex; gap: 8px; align-items: center; padding: 0 var(--gut-r) 0 var(--gut-l); background: var(--wood-3); border-bottom: var(--px) solid var(--ink); box-shadow: inset 0 var(--px) 0 var(--wood-4); }
.counter.ready { background: var(--wood-4); color: var(--ink); }
.counter-label { font: 400 var(--s1) var(--pixel); }
.put-away { display: flex; gap: 6px; overflow-x: auto; }
.chip { flex: none; padding: 3px 8px; border: 2px solid var(--ink); background: var(--paper-deep); color: var(--ink); font: 400 12px/1.2 var(--pixel); }
.lamp { position: absolute; z-index: 5; right: 14px; top: 54px; pointer-events: none; }
.lamp .on { display: none; }
.desk.lamp-on .lamp .on { display: block; }
.desk.lamp-on .lamp .off { display: none; }
.pool { position: absolute; z-index: 1; right: 0; top: 160px; display: none; pointer-events: none; }
.desk.lamp-on .pool { display: block; }
.ring { position: absolute; z-index: 1; right: 22%; bottom: 18%; opacity: 0.55; pointer-events: none; }
.sticker { position: absolute; z-index: 3; cursor: grab; touch-action: none; user-select: none; }
.sticker:hover { animation: wiggle 0.14s steps(1); }
@keyframes wiggle { 50% { rotate: 6deg; } }
.envelope { position: absolute; z-index: 2; left: 2.5%; top: 30%; }
.env-stamp { position: absolute; left: 30px; bottom: 26px; --tilt: -6deg; background: var(--manila); }
.unpack-hint { position: absolute; z-index: 3; left: 2.5%; top: calc(30% + 136px); display: flex; flex-direction: column; align-items: flex-start; gap: 10px; max-width: 230px; font: 400 var(--s2)/1.4 var(--pixel); }

/* papers */
.paper { position: absolute; z-index: 10; width: 320px; max-width: calc(100% - 16px); background: var(--paper); color: var(--ink); font-size: var(--s2); line-height: 1.5; rotate: var(--tilt, 0deg); box-shadow: var(--px) var(--px) 0 var(--shade); cursor: grab; touch-action: none; user-select: none; image-rendering: auto; transition: rotate 0.12s ease-out, scale 0.12s ease-out, box-shadow 0.12s ease-out; }
.paper.moving { transition: left 0.32s ease-out, top 0.32s ease-out, opacity 0.2s ease-out, scale 0.32s ease-out, rotate 0.12s ease-out; }
.paper.held, .sticker.held { z-index: 900 !important; scale: 1.02; rotate: 0deg; box-shadow: var(--lift) var(--lift) 0 var(--shade); cursor: grabbing; }
.paper.packed { opacity: 0; scale: 0.5; pointer-events: none; visibility: hidden; transition: left 0.3s ease-in, top 0.3s ease-in, opacity 0.2s ease-in 0.1s, scale 0.3s ease-in, visibility 0s linear 0.3s; }
.paper.leaving { translate: 0 -60px; opacity: 0; transition: translate 0.2s ease-in, opacity 0.2s ease-in; }
.paper.away { display: none; }
.paper:focus { outline: none; }
.paper:focus-visible { outline: 3px solid var(--cover-ink); outline-offset: 2px; }
.paper-pad { padding: 14px 16px 16px; }
.paper .meta { margin-top: 2px; font: 400 var(--s1)/1.5 var(--mono); color: var(--ink-soft); }
.paper h3 { font: 600 var(--s3)/1.3 var(--sans); }
.paper-title { margin-bottom: 8px; font: 600 var(--s2) var(--pixel); }

.p-id { width: 330px; background: var(--paper-deep); border: 2px solid var(--ink); }
.id-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
.id-photo { border: 2px solid var(--ink); background: var(--field); align-self: start; }
.id-fields { display: grid; gap: 4px; align-content: start; }
.p-diploma { width: 340px; border: 6px double var(--ink); background: var(--field); }
.p-diploma .seal { float: right; margin: 0 0 6px 8px; }
.p-honours { width: 340px; }
.honour { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 10px; padding-block: 8px; border-top: 1px solid var(--rule); }
.honour:first-of-type { border-top: 0; }
.honour .yr { font: 400 var(--s1)/1.7 var(--mono); color: var(--ink-soft); }
.honour b { font-weight: 600; }
.honour p { font-size: var(--s1); color: var(--ink-soft); }

.p-case { width: 214px; padding: 14px 12px 12px; background: var(--manila); border: 2px solid var(--manila-deep); }
.folder-tab { position: absolute; left: 10px; top: -20px; height: 20px; padding: 1px 10px 0; background: var(--manila); border: 2px solid var(--manila-deep); border-bottom: 0; font: 600 12px/1.4 var(--pixel); }
.p-case.hot { border-color: var(--stamp-green); }
.p-case.hot .folder-tab { background: var(--cover-ink); border-color: var(--stamp-green); }
.folder-face { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; }
.folder-face b { display: block; font: 600 var(--s2)/1.25 var(--pixel); }
.folder-face .meta { color: var(--ink); }
.p-case .clip { position: absolute; right: 30px; top: -14px; }
.p-case .tape { position: absolute; right: 22px; top: -9px; width: 58px; height: 18px; background: var(--tape); rotate: 5deg; }
.p-case .mini-stamp { margin-top: 8px; font-size: 12px; --tilt: -4deg; }
.peek { position: absolute; right: 12px; bottom: -22px; z-index: -1; padding: 2px 8px 4px; background: var(--field); border: 2px solid var(--ink); font: 400 12px/1.2 var(--pixel); translate: 0 -18px; transition: translate 0.12s steps(2); }
.p-case:hover .peek, .p-case:focus-visible .peek { translate: 0 0; }
.p-case.open { width: 520px; padding: 0; background: var(--paper); border: 0; display: flex; flex-direction: column; cursor: default; }
.p-case.open .paper-head { cursor: grab; }
.paper-head { display: flex; gap: 10px; align-items: center; padding: 7px 10px 6px 14px; background: var(--manila); border-bottom: 2px solid var(--ink); }
.paper-head h2 { flex: 1; min-width: 0; font: 600 var(--s3)/1.2 var(--pixel); }
.paper-head .pg { font: 400 12px var(--mono); }
.paper-head .close { padding: 2px 8px; border: 2px solid var(--ink); background: var(--field); font: 400 var(--s1) var(--mono); }
.paper-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 34px; cursor: grab; }
.case-top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.case-top > div { flex: 1 1 200px; min-width: 0; }
.line { margin-top: 10px; font-size: var(--s3); }
.points { margin-top: 10px; }
.points li + li { margin-top: 6px; }
.stack { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--rule); font: 400 var(--s1)/1.7 var(--mono); }
.stack mark, .sk.hot, .sk.used { background: var(--mark-hash); color: var(--ink); }
.demo-zone { margin-top: 14px; }
.demo-box { margin-top: 10px; padding: 12px; border: 2px solid var(--ink); background: var(--field); cursor: auto; user-select: text; }

/* skills drawer */
.drawer { position: absolute; z-index: 6; left: 50%; bottom: 0; width: min(640px, 66%); translate: -50% 0; transform: translateY(var(--drawer-y, 110%)); }
.drawer.sliding { transition: transform 0.24s ease-out; }
.drawer-box { max-height: 52vh; overflow: auto; padding: 12px; background: var(--wood-3); border: var(--px) solid var(--ink); border-bottom: 0; }
.skills-card { padding: 12px 14px; background: var(--paper); color: var(--ink); }
.skills-card .note { margin-bottom: 8px; font-size: var(--s1); color: var(--ink-soft); }
.sk-group + .sk-group { margin-top: 10px; }
.sk-group h3 { font: 600 var(--s2)/1.4 var(--pixel); }
.sk { margin: 4px 6px 0 0; padding: 1px 6px; border: 1px solid var(--rule); background: none; font: 400 var(--s1)/1.5 var(--mono); }
.sk.hot { border-color: var(--ink); }
.drawer-front { display: flex; justify-content: flex-start; padding-left: 12px; height: 34px; background: var(--wood-4); border: var(--px) solid var(--ink); border-bottom: 0; }
.handle { display: flex; gap: 8px; align-items: center; padding: 4px 12px; border: 0; background: none; color: var(--ink); font: 600 var(--s1) var(--pixel); cursor: ns-resize; touch-action: none; }

/* ---------- entry record ---------- */
.record-sec { position: relative; z-index: 1; padding: 64px 0 calc(110px + var(--safe-b)); background: var(--paper); color: var(--ink); }
.record-wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px 48px; max-width: 1080px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.record-intro h2 { font: 600 var(--s5)/1.1 var(--pixel); }
.record-intro p { margin-top: 10px; font-size: var(--s2); color: var(--ink-soft); }
.printer-area { position: relative; min-height: 760px; }

  function play(name) {
    if (!snd.on) return;
    const now = performance.now(), gap = name === "tick" ? 40 : 70;
    if (snd.last[name] && now - snd.last[name] < gap) return;
    snd.last[name] = now;
    const c = ctx();
    if (!c) return;
    const t = c.currentTime;
    if (name === "thud") { tone(c, t, "sine", 120, 42, 0.6, 0.2); noise(c, t, 0.05, "lowpass", 900, 0.35); }
    else if (name === "rustle") noise(c, t, 0.16, "bandpass", 2600, 0.12);
    else if (name === "drawer") noise(c, t, 0.34, "lowpass", 260, 0.2, 900);
    else if (name === "print") { for (let i = 0; i < 6; i++) noise(c, t + i * 0.09, 0.06, "bandpass", 1400, 0.08); }
    else if (name === "tick") tone(c, t, "square", 1700, 0, 0.025, 0.014);
  }
  function toggle() { snd.on = !snd.on; if (snd.on) ctx(); return snd.on; }

  const CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  function board(el, phrases, n) {
    el.innerHTML = Array.from({ length: n }, () => '<span class="tile">&nbsp;</span>').join("");
    const tiles = Array.from(el.children), cur = Array(n).fill(" ");
    let idx = -1, timer = null, running = false, paused = false, gen = 0;
    const list = (phrases || []).filter(Boolean);
    function set(i, c) { tiles[i].textContent = c === " " ? " " : c; cur[i] = c; }
    function show(text, instant) {
      const g = ++gen;
      text = String(text).toUpperCase().slice(0, n).padEnd(n, " ");
      if (instant || reduced()) { for (let i = 0; i < n; i++) set(i, text[i]); next(); return; }
      let busy = 0;
      for (let i = 0; i < n; i++) {
        if (cur[i] === text[i]) continue;
        busy++;
        const flips = 2 + Math.floor(Math.random() * 3);
        let k = 0;
        const step = () => {
          if (g !== gen) return;
          if (k < flips) { set(i, CH[Math.floor(Math.random() * CH.length)]); play("tick"); k++; setTimeout(step, 55); }
          else { set(i, text[i]); if (--busy === 0) next(); }
        };
        setTimeout(step, i * 24);
      }
      if (busy === 0) next();
    }
    function next() {
      clearTimeout(timer);
      if (!running || !list.length) return;
      timer = setTimeout(() => {
        if (paused) { next(); return; }
        idx = (idx + 1) % list.length;
        show(list[idx]);
      }, idx < 0 ? 0 : 3200);
    }
    el.addEventListener("mouseenter", () => { paused = true; });
    el.addEventListener("mouseleave", () => { paused = false; });
    return {
      start() { if (running) return; running = true; next(); },
      blank() { running = false; clearTimeout(timer); idx = -1; show("", true); },
      get running() { return running; },
    };
  }

  return { play: play, toggle: toggle, board: board, get soundOn() { return snd.on; } };
})();

<script id="demos">// Small demos that run fully in the browser. No network calls, no keys.
window.DEMOS = (function () {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const stamp = (text, colour) => '<span class="ink ' + colour + ' thud">' + esc(text) + "</span>";
  const label = (text) => '<p class="demo-label">' + esc(text) + "</p>";

  // --- IOC Enricher: find IPs, domains and hashes with regular expressions ---
  const IOC = /\b(?:[a-f0-9]{64}|[a-f0-9]{40}|[a-f0-9]{32})\b|\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b|\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}\b/gi;
  function iocType(v) {
    if (/^[a-f0-9]+$/i.test(v)) return v.length === 64 ? ["hash", "SHA-256 hash"] : v.length === 40 ? ["hash", "SHA-1 hash"] : ["hash", "MD5 hash"];
    return /^[\d.]+$/.test(v) ? ["ip", "IP address"] : ["domain", "Domain"];
  }
  function ioc(el) {
    const sample = "ALERT 03:14 UTC: workstation FIN-07 made repeated connections to 203.0.113.45 and 192.0.2.118 after a user opened invoice-update.example.net.\n" +
      "Dropped file MD5: 9e107d9d372bb6826bd81d3542a419d6\nSecond stage fetched from cdn.login-check.example.org, SHA-256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855";
    el.innerHTML = label("Demo with a made-up alert. Edit or paste your own text.") +
      '<div class="ioc-wrap"><div class="ioc-hl" aria-hidden="true"></div><textarea class="ioc-in" id="ioc-input" aria-label="Alert text" spellcheck="false"></textarea></div>' +
      '<div class="scroll-x"><table class="demo-table"><thead><tr><th>Indicator</th><th>Type</th></tr></thead><tbody></tbody></table></div>' +
      '<p class="demo-note">In the real tool, each of these is looked up on VirusTotal, AbuseIPDB and Shodan.</p>';
    const input = el.querySelector("textarea"), hl = el.querySelector(".ioc-hl"), body = el.querySelector("tbody");
    function scan() {
      const text = input.value, seen = new Map();
      let html = "", last = 0, m;
      IOC.lastIndex = 0;
      while ((m = IOC.exec(text))) {
        const t = iocType(m[0]);
        html += esc(text.slice(last, m.index)) + '<mark class="m-' + t[0] + '">' + esc(m[0]) + "</mark>";
        last = m.index + m[0].length;
        if (!seen.has(m[0].toLowerCase())) seen.set(m[0].toLowerCase(), [m[0], t]);
      }
      hl.innerHTML = html + esc(text.slice(last)) + "\n";
      input.style.height = "auto";
      input.style.height = input.scrollHeight + 4 + "px";
      body.innerHTML = seen.size
        ? Array.from(seen.values()).map((x) => '<tr><td><mark class="m-' + x[1][0] + '">' + esc(x[0]) + "</mark></td><td>" + x[1][1] + "</td></tr>").join("")
        : '<tr><td colspan="2">No indicators found in this text.</td></tr>';
    }
    input.value = sample;
    input.addEventListener("input", scan);
    scan();
  }

  // --- Scure: simple local checks on a URL ---
  const BAD_TLDS = ["zip", "mov", "xyz", "top", "click", "country", "gq", "tk", "ml", "cf", "work"];
  function checkUrl(raw) {
    const fired = [];
    let u;
    try { u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : "https://" + raw); } catch (err) { return null; }
    const host = u.hostname, labels = host.split(".");
    if (u.protocol === "http:") fired.push("Uses http instead of https");
    if (/^[\d.]+$/.test(host) || host.includes(":")) fired.push("Uses an IP address instead of a domain name");
    if (raw.replace(/^[a-z][a-z0-9+.-]*:\/\//i, "").includes("@")) fired.push("Contains an @, which can hide the real destination");
    if (/xn--/.test(host) || /[^\x00-\x7f]/.test(raw) || labels.some((l) => /[a-z]\d[a-z]|[a-z]{3}[01]$/.test(l))) fired.push("Has lookalike characters in the name");
    if (labels.length > 4 || host.length > 40) fired.push("Has a very long chain of subdomains");
    if (BAD_TLDS.includes(labels[labels.length - 1])) fired.push("Ends in a top-level domain often used for abuse");
    return fired;
  }
  function scure(el) {
    el.innerHTML = label("Demo only. The real app checks VirusTotal, Google Safe Browsing, URLScan.io and a sandboxed browser.") +
      '<label class="demo-field" for="scure-url">Link to check</label><input class="demo-input" id="scure-url" type="text" spellcheck="false" autocomplete="off">' +
      '<div class="demo-out" aria-live="polite"></div>';
    const input = el.querySelector("input"), out = el.querySelector(".demo-out");
    function run() {
      const raw = input.value.trim(), fired = raw ? checkUrl(raw) : null;
      if (!raw) { out.innerHTML = "<p>Type a link to check it.</p>"; return; }
      if (!fired) { out.innerHTML = "<p>That does not look like a link.</p>"; return; }
      out.innerHTML = (fired.length ? stamp("Suspicious", "red") : stamp("Safe", "green")) +
        (fired.length ? "<ul>" + fired.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "<p>None of the six local checks fired.</p>");
    }
    input.value = "http://secure-login.account-update.verify.paypa1.example.zip/@signin";
    input.addEventListener("input", run);
    run();
  }

  // --- PolicyLens: change the rule, the clause is re-checked ---
  function policy(el) {
    const clauseDays = 21;
    el.innerHTML = label("Simplified demo of the re-check idea. The real system reads whole policies and contracts.") +
      '<p class="demo-field">Policy rule</p><p class="demo-doc">Invoices must be paid within <input class="demo-num" id="policy-days" type="number" min="1" max="120" value="30" aria-label="Days allowed by the rule"> days.</p>' +
      '<p><button class="btn-quiet" data-days="30">Set 30 days</button> <button class="btn-quiet" data-days="14">Set 14 days</button></p>' +
      '<p class="demo-field">Stored contract clause</p><p class="demo-doc">The Client shall pay each invoice within ' + clauseDays + " days of receipt.</p>" +
      '<div class="demo-out" aria-live="polite"></div>';
    const input = el.querySelector("input"), out = el.querySelector(".demo-out");
    function run() {
      const days = parseInt(input.value, 10);
      if (!days) { out.innerHTML = "<p>Enter a number of days.</p>"; return; }
      out.innerHTML = clauseDays <= days
        ? stamp("Complies", "green") + "<p>" + clauseDays + " days is within the " + days + " days the rule allows.</p>"
        : stamp("Violates", "red") + "<p>The clause allows " + clauseDays + " days, but the rule now allows only " + days + ". This contract would be flagged for the legal team.</p>";
    }
    input.addEventListener("input", run);
    el.addEventListener("click", (ev) => { const b = ev.target.closest("[data-days]"); if (b) { input.value = b.dataset.days; run(); } });
    run();
  }

  // --- S.H.I.E.L.D: sort a written report with keyword rules ---
  const REPORTS = [
    "Control, I have a man collapsed near the lift lobby on level 3. He is unconscious and not responding.",
    "There is an unattended black bag beside the east entrance. It has been there for about twenty minutes.",
    "A visitor says her wallet was stolen at the food court. She saw someone walk off quickly towards the car park.",
  ];
  const TYPES = [
    ["Medical emergency", /collapsed|unconscious|bleeding|injured|not breathing/i, "High", "Call an ambulance, start first aid and keep the area clear."],
    ["Fire or smoke", /fire|smoke|burning|alarm/i, "High", "Raise the alarm, begin evacuation and call the fire service."],
    ["Suspicious item", /unattended|suspicious (bag|package|item)|left behind/i, "Medium", "Keep people away, do not touch it and escalate to the supervisor."],
    ["Theft", /stolen|theft|snatched|pickpocket/i, "Low", "Take a statement, note the description and review nearby CCTV."],
    ["Intrusion", /forced|broke in|trespass|intruder/i, "Medium", "Secure the entry point and request backup before approaching."],
  ];
  function shield(el) {
    el.innerHTML = label("Demo only. The real assistant used Whisper speech-to-text and a local Mistral model.") +
      '<p class="demo-field">Pick an officer report</p><div class="demo-picks">' +
      REPORTS.map((r, i) => '<button class="demo-pick" data-r="' + i + '">Report ' + (i + 1) + "</button>").join("") + '</div><div class="demo-out" aria-live="polite"></div>';
    const out = el.querySelector(".demo-out");
    function run(i) {
      const text = REPORTS[i], hit = TYPES.find((t) => t[1].test(text)) || ["Unclassified", null, "Low", "Ask the officer for more detail."];
      el.querySelectorAll(".demo-pick").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.r === i)));
      out.innerHTML = '<p class="demo-doc">' + esc(text) + "</p><dl class=\"demo-dl\"><dt>Incident type</dt><dd>" + hit[0] + "</dd><dt>Severity</dt><dd>" +
        stamp(hit[2], hit[2] === "High" ? "red" : "green") + "</dd><dt>Suggested next step</dt><dd>" + hit[3] + "</dd></dl>";
    }
    el.addEventListener("click", (ev) => { const b = ev.target.closest("[data-r]"); if (b) run(+b.dataset.r); });
    run(0);
  }

  return { ioc: ioc, scure: scure, policy: policy, shield: shield, checkUrl: checkUrl };
})();

  // ----- scroll scene: the booth builds, then the file unpacks -----
  const B_SHUT = 160, B_COUNTER = 120, B_LAMP = 70, B_BOARD = 70, BOOT = B_SHUT + B_COUNTER + B_LAMP + B_BOARD, UNIT = 110, DWELL = 320;
  const stageH = () => Math.max(window.innerHeight, 640);
  const unpackEnd = () => BOOT + ORDER().length * UNIT;
  const docTop = (el) => el.getBoundingClientRect().top + window.scrollY;
  function sizeScene() {
    const sc = $("#scene"), stage = $("#stage");
    if (!sc) return;
    if (isPhone()) { sc.style.height = ""; stage.style.height = ""; return; }
    stage.style.height = stageH() + "px";
    sc.style.height = stageH() + unpackEnd() + DWELL + "px";
  }
  function sceneNow() {
    const n = ORDER().length;
    if (isPhone()) return { shut: 4, counter: 3, lamp: true, board: true, out: n };
    const px = Math.max(0, -$("#scene").getBoundingClientRect().top), bf = ui.boothForced || ui.forced;
    let out = ui.forced ? n : clamp(Math.floor((px - BOOT) / UNIT) + 1, 0, n);
    if (ui.handled) out = Math.max(out, ui.maxOut);
    return {
      shut: bf ? 4 : clamp(Math.floor(px / (B_SHUT / 4)), 0, 4),
      counter: bf ? 3 : clamp(Math.floor((px - B_SHUT) / (B_COUNTER / 3)), 0, 3),
      lamp: bf || px >= B_SHUT + B_COUNTER + B_LAMP / 2,
      board: bf || px >= BOOT - 20,
      out: out,
    };
  }
  function applyScene(force) {
    if (!$("#scene")) return;
    const s = sceneNow(), prev = force ? {} : ui.scene || {};
    const sh = $("#shutter"), ct = $("#counter"), desk = $("#desk");
    if (s.shut !== prev.shut) { sh.style.transform = "translateY(" + -s.shut * 25 + "%)"; sh.classList.toggle("up", s.shut === 4); if (!force) FX.play("tick"); }
    if (s.counter !== prev.counter) ct.style.transform = "translateX(" + -(3 - s.counter) * 34 + "%)";
    if (s.lamp !== prev.lamp) { desk.classList.toggle("lamp-on", s.lamp); if (!force && s.lamp) FX.play("tick"); }
    if (s.board !== prev.board) { if (s.board) board.start(); else board.blank(); }
    ORDER().forEach((id, i) => {
      const want = i < s.out, had = prev.out != null && i < prev.out;
      if (!force && want === had) return;
      if (id === "drawer") showDrawer(want, force);
      else if (want) unpack(id, force, i);
      else pack(id, force);
    });
    const hint = $("#unpack-hint"), n = ORDER().length;
    hint.hidden = s.out >= n;
    $("#unpack-say").hidden = s.out > 0;
    if (s.shut === 4 && s.board && prev.board !== true) say("arrive");
    if (s.out >= n && prev.out < n) say("unpacked");
    ui.maxOut = Math.max(ui.maxOut, s.out);
    ui.scene = s;
  }

  function envCenter() { const e = $("#envelope"); return [e.offsetLeft + e.offsetWidth / 2, e.offsetTop + e.offsetHeight / 2]; }
  function fanPos(id, el) {
    const desk = $("#desk"), w = desk.clientWidth, h = desk.clientHeight, i = caseIndex(id);
    const f = i >= 0 ? [0.19 + i * 0.072, 0.55 + (i % 2) * 0.08] : { id: [0.19, 0.1], diploma: [0.43, 0.07], honours: [0.71, 0.11] }[id];
    const x = Math.round(f[0] * w + rnd(id, "jx") * 20 - 10), y = Math.round(f[1] * h + rnd(id, "jy") * 16 - 8);
    return [clamp(x, 8, Math.max(8, w - el.offsetWidth - 8)), clamp(y, 56, Math.max(56, h - el.offsetHeight - 48))];
  }
  function setPos(el, x, y) { el.style.left = x + "px"; el.style.top = y + "px"; }
  function still(el, fn) { el.classList.remove("moving"); el.style.transition = "none"; fn(); void el.offsetWidth; el.style.transition = ""; }
  function unpack(id, instant, order) {
    const el = paperEl(id), st = pst(id);
    if (!el || st.away) return;
    if (st.x == null) { const p = fanPos(id, el); st.x = p[0]; st.y = p[1]; }
    if (isPhone()) { el.classList.remove("packed"); return; }
    const go = () => { el.classList.remove("packed"); setPos(el, st.x, st.y); el.style.zIndex = 10 + (order || 0); };
    if (instant) still(el, go); else { el.classList.add("moving"); go(); FX.play("rustle"); }
  }
  function pack(id, instant) {
    const el = paperEl(id), st = pst(id);
    if (!el || st.away || isPhone()) return;
    const c = envCenter(), go = () => { el.classList.add("packed"); setPos(el, Math.round(c[0] - el.offsetWidth / 2), Math.round(c[1] - el.offsetHeight / 2)); };
    if (instant) still(el, go); else { el.classList.add("moving"); go(); }
  }
  function placeStickers() {
    const desk = $("#desk"), w = desk.clientWidth, h = desk.clientHeight;
    const spots = { cup: [0.84, 0.72], plant: [0.93, 0.5], laptop: [0.06, 0.84], shield: [0.16, 0.24] };
    $$(".sticker", desk).forEach((el) => {
      const id = el.dataset.sticker, p = ui.stickers[id] || [Math.round(spots[id][0] * w), Math.round(spots[id][1] * h)];
      setPos(el, clamp(p[0], 0, w - 50), clamp(p[1], 50, h - 50));

  function onResize() {

  }

  // ----- handling papers -----
  function raise(el) {

  function openCase(id) {

  function turn(part, swap) {

  // ----- the entry record printer and the tear-off slip -----
  function printNow() { ui.printed = true; const a = $("#printer-area"); if (a) { a.classList.remove("printing"); a.classList.add("printed"); } }
  function watchPrinter() {

      if (reduced()) printNow(); else { a.classList.add("printing"); FX.play("print"); setTimeout(printNow, 1450); }

  // stamping takes over clicks on stampable paper while a stamp is held
  document.addEventListener("click", (ev) => {

      ev.preventDefault();

        const r = tgt.getBoundingClientRect();
        stampAt(s, r.left + r.width / 2 + Math.random() * 6 - 3, r.top + r.height / 2 + Math.random() * 6 - 3, kind);
      } else {

        stampAt(s, p[0], p[1], kind);
      }
      return;
    }
    if (tgt) { ACTIONS.target(tgt); return; }

  // dragging: papers, stickers, the torn slip and the drawer handle
  let drag = null, justDragged = false, drawerDrag = null, perfDrag = null, perfMoved = false;
  const NO_DRAG = "button, a, input, textarea, select, label, .demo-box, .f";
  document.addEventListener("pointerdown", (ev) => {
    lastPointer = ev.pointerType || "mouse";
    if (ev.button !== 0) return;
    if (ev.target.closest("#handle") && !isPhone()) { drawerDrag = { sy: ev.clientY, start: ui.drawer, h: boxH(), moved: false }; return; }
    const perf = ev.target.closest("#perf");
    if (perf) { perfDrag = { sx: ev.clientX, w: perf.offsetWidth, start: ui.torn }; perfMoved = false; perf.setPointerCapture(ev.pointerId); return; }
    const el = ev.target.closest("[data-drag]");
    if (!el || ui.holding) return;
    if (el.classList.contains("paper") || el.id === "slip") raise(el);
    if (ev.target.closest(NO_DRAG) || isPhone()) return;
    drag = { el: el, sx: ev.clientX, sy: ev.clientY, ox: el.offsetLeft, oy: el.offsetTop, moved: false, id: ev.pointerId };
  });
  document.addEventListener("pointermove", (ev) => {
    lastXY = [ev.clientX, ev.clientY];
    if (ev.pointerType) lastPointer = ev.pointerType;
    if (ui.holding && ev.pointerType === "mouse") {
      const g = $("#ghost"), pv = $("#preview");
      g.hidden = false; moveGhost(ev.clientX, ev.clientY);
      const s = ev.target.closest && ev.target.closest(".stampable");
      if (s && !ev.target.closest(".corner")) { const p = pulled(s, ev.clientX, ev.clientY); pv.hidden = false; pv.style.left = p[0] + "px"; pv.style.top = p[1] + "px"; }
      else pv.hidden = true;
    }
    if (drawerDrag) {
      const dy = drawerDrag.sy - ev.clientY;
      if (Math.abs(dy) > 5) drawerDrag.moved = true;
      if (drawerDrag.moved && drawerDrag.h) { ui.drawer = clamp(drawerDrag.start + dy / drawerDrag.h, 0, 1); layoutDrawer(false); }
      return;
    }
    if (perfDrag) {
      const dx = Math.abs(ev.clientX - perfDrag.sx);
      if (dx > 6) perfMoved = true;
      if (perfMoved) { setTear(clamp(perfDrag.start + (dx / perfDrag.w) * 1.2, 0, 1)); if (ui.torn >= 0.85) { perfDrag = null; tearOff(); } }
      return;

    if (!drag || ev.pointerId !== drag.id) return;
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 5) return;
      drag.moved = true;
      drag.el.classList.remove("moving"); drag.el.classList.add("held");
      try { drag.el.setPointerCapture(ev.pointerId); } catch (err) { /* capture is optional */ }
      FX.play("rustle");
      if (drag.el.classList.contains("paper")) markHandled();
    }
    moveTo(drag.el, drag.ox + dx, drag.oy + dy);
    const ct = $("#counter");
    if (ct && drag.el.classList.contains("paper")) { const r = ct.getBoundingClientRect(); ct.classList.toggle("ready", ev.clientY < r.bottom && ev.clientY > r.top - 40); }
  });
  function endDrag(ev) {
    if (drawerDrag) {
      if (drawerDrag.moved) { setDrawer(ui.drawer > 0.4 ? 1 : 0); setTimeout(() => { drawerDrag = null; }, 0); } else drawerDrag = null;
      return;
    }
    if (perfDrag) { perfDrag = null; return; }
    if (!drag) return;
    const d = drag; drag = null;

    d.el.classList.remove("held");
    const tilt = +(Math.random() * 6 - 3).toFixed(1);
    d.el.style.setProperty("--tilt", tilt + "deg");
    const ct = $("#counter");
    if (d.el.classList.contains("paper")) {
      pst(d.el.dataset.id).tilt = tilt;
      if (ct && ct.classList.contains("ready")) { ct.classList.remove("ready"); putAway(d.el.dataset.id, { x: d.ox, y: Math.max(d.oy, 56) }); return; }
    } else if (d.el.id === "slip") d.el.style.setProperty("--tilt", tilt + "deg");
    if (ct) ct.classList.remove("ready");
    FX.play("rustle");
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  document.addEventListener("keydown", (ev) => {
    const t = ev.target, typing = t.closest && t.closest(".f, input, textarea, [contenteditable]");
    if (ev.key === "Enter" && t.closest && t.closest(".f")) ev.preventDefault();
    if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.key === "Escape") {
      if (ui.holding) { putBack(); return; }
      if ($("#intro")) { closeIntro(); return; }
      if (ui.drawer > 0.5) { setDrawer(0); $("#handle").focus(); return; }
      const open = paperIds().filter((id) => pst(id).open);
      const which = open.includes(ui.front) ? ui.front : open[open.length - 1];
      if (which) closeCase(which);
      return;
    }
    if ((ev.key === "s" || ev.key === "S") && (ui.view === "desk" || $("#intro")) && !editing) {
      ev.preventDefault();
      if (!ui.holding) pick("approved"); else if (ui.holding === "approved") pick("denied"); else { putBack(); return; }
      const target = stampTarget();
      if (target) setTimeout(() => { target.scrollIntoView({ block: "center", behavior: behavior() }); target.focus({ preventScroll: true }); }, 0);
      return;
    }
    const el = t.closest && t.closest("[data-drag]");
    if (!el || el !== t || isPhone()) return;
    if ((ev.key === "Enter" || ev.key === " ") && el.matches(".p-case:not(.open)")) { ev.preventDefault(); openCase(el.dataset.id); return; }
    const step = { ArrowLeft: [-24, 0], ArrowRight: [24, 0], ArrowUp: [0, -24], ArrowDown: [0, 24] }[ev.key];
    if (step) { ev.preventDefault(); markHandled(); raise(el); moveTo(el, el.offsetLeft + step[0], el.offsetTop + step[1]); }
  });
  app.addEventListener("input", (ev) => {
    const el = ev.target.closest("[data-k]");
    if (!el) return;
    const keys = el.dataset.k.split("."), last = keys.pop();
    const text = el.textContent.replace(/\s+/g, " ").trim();
    at(keys.join("."))[last] = el.hasAttribute("data-list") ? text.split(",").map((s) => s.trim()).filter(Boolean) : text;
    touched(); setOwner();
  });

  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; if (ui.view === "desk" && !editing) { applyScene(); updatePill(); } });
  }, { passive: true });
  let rz = null;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(onResize, 120); });
  narrow.addEventListener("change", () => { if (ui.view === "desk" && !editing) render(); });
  setInterval(() => { const c = $("#clock"); if (c) c.textContent = clock(); }, 20000);

  // ----- saving: the whole page, rebuilt from its own source and the current data -----
  function buildDoc() {
    const lt = "<", sc = "script", block = (id) => lt + sc + ' id="' + id + '">' + $("#" + id).textContent + lt + "/" + sc + ">\n";
    const json = JSON.stringify(state, null, 1).replace(/</g, "\\u003c");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" +
      ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}" +
      "</style></head><body>" +
      "<title>CV Please</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n" +
      "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Pixelify+Sans:wght@400;600&display=swap\">\n" +
      "<style id=\"page-style\">" + $("#page-style").textContent + "</style>\n<div id=\"app\"></div>\n<div id=\"intro-root\"></div>\n<div id=\"fixed-root\"></div>\n" +
      lt + sc + " type=\"application/json\" id=\"cv-data\">" + json + lt + "/" + sc + ">\n" + block("sprites") + block("fx") + block("demos") + block("main") + "</body></html>";
  }
  async function save() {
    if (!artifact || busy || !dirty) return;
    busy = true; note = ""; setOwner();
    try {
      await artifact.publish(buildDoc());
    } catch (err) {
      busy = false;
      const code = err && err.code;
      if (code === "conflict") note = "A newer version was saved first. Reloading it.";
      else if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].includes(code)) {
        canEdit = false; editing = false; state = JSON.parse(ORIGINAL); render(); return;
      }
      else if (code === "too_large") note = "Too much text to save. Shorten something and try again.";
      else if (code === "rate_limited") note = "Saving too often. Wait a moment, then file again.";
      else note = "Could not save. Your edits are still here, so try again.";
      setOwner();
    }
  }

  SPR.installTiles(PX);
  renderFixed();
  render();
  renderIntro();

  (async function () {
    if (!window.claude || !window.claude.use) return;
    const got = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
    artifact = got[0];
    if (!artifact) return;
    canEdit = got[1] ? await got[1].canEdit() : true;
    if (canEdit) setOwner();
  })();
})();
</script>
</body></html>
