<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>CV Please</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Jersey+10&family=Tiny5&display=swap" id="fonts">
<style id="page-style">/* Layout: a passport spread opens the visit. Then a booth (applicant at the window, board, nameplate) above a wooden desk, pinned while scrolling builds the booth and unpacks the file. A stamp bar slides in from the right whenever a stampable paper is out. The entry record prints below the desk. A plain list view holds the same content in reading order. */
:root {
  color-scheme: light;
  --paper: #ebe5d4;
  --paper-deep: #dfd7c1;
  --field: #f6f2e6;
  --ink: #22201b;
  --ink-soft: #575246;
  --rule: #a99f88;
  --stamp-red: #a23226;
  --red-dark: #74231b;
  --stamp-green: #33654a;
  --green-light: #5f8f72;
  --booth: #4d5144;
  --booth-dark: #2f3329;
  --booth-light: #979d87;
  --cover: #2e4939;
  --cover-edge: #223629;
  --cover-ink: #dcc98e;
  --gold-dark: #a8914f;
  --manila: #d6c08c;
  --manila-deep: #bfa66f;
  --wood-1: #2a2018;
  --wood-2: #3a2c20;
  --wood-3: #5e4631;
  --wood-4: #b08a62;
  --wood-5: #dcbd96;
  --on-desk: #ece6d6;
  --shade: rgba(20, 15, 10, 0.5);
  --pool-1: rgba(220, 201, 142, 0.2);
  --pool-2: rgba(220, 201, 142, 0.12);
  --pool-3: rgba(220, 201, 142, 0.06);
  --mark-ip: #e9bdb2;
  --mark-domain: #bcd8c5;
  --mark-hash: #e8d795;
  --pixel: "Tiny5", ui-monospace, monospace;
  --display: "Jersey 10", "Tiny5", ui-monospace, monospace;
  --typed: "Courier Prime", "Courier New", ui-monospace, monospace;
  --sans: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --px: 3px;
  --lift: 8px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --safe-b: env(safe-area-inset-bottom, 0px);
  --page-w: 400px;
  --page-h: 384px;
  --bar-w: 168px;
}

* { box-sizing: border-box; }
*, *::before, *::after { font-variant-ligatures: none !important; }
body { background: var(--paper); color: var(--ink); font: 400 17px/1.55 var(--sans); }
html.locked, html.locked body { overflow: hidden; }
a { color: inherit; text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--stamp-green); outline-offset: 3px; }
.intro :focus-visible, .booth :focus-visible, .stampbar :focus-visible, .pill :focus-visible, .counter :focus-visible, .drawer-front :focus-visible, .unpack-hint :focus-visible { outline-color: var(--cover-ink); }
#hello:focus { outline: none; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding-left: 1.1em; }
.spr { display: block; image-rendering: pixelated; flex: none; -webkit-user-drag: none; user-select: none; }
.passport, .printer-area.printed .receipt { user-select: none; -webkit-user-select: none; }
.scroll-x { overflow-x: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* buttons: one loud, the rest quiet */
.btn-main { padding: 9px 18px 8px; border: 0; border-bottom: 4px solid var(--shade); background: var(--stamp-green); color: var(--on-desk); font: 400 20px/1 var(--pixel); -webkit-font-smoothing: none; }
.btn-main:active { translate: 0 2px; border-bottom-width: 2px; }
.btn-main:disabled { opacity: 0.5; cursor: default; }
.btn-quiet { padding: 4px 2px; border: 0; background: none; font: 400 20px/1 var(--pixel); text-decoration: underline; text-underline-offset: 4px; -webkit-font-smoothing: none; }
.btn-quiet:disabled { opacity: 0.5; cursor: default; }

/* ink stamps with a worn pixel edge */
.ink { position: relative; display: inline-block; padding: 6px 11px 4px; font: 400 20px/1 var(--display); rotate: var(--tilt, -3deg); -webkit-font-smoothing: none; }
.ink::before { content: ""; position: absolute; inset: 0; border: var(--px) solid currentColor; -webkit-mask-image: var(--worn); mask-image: var(--worn); -webkit-mask-size: var(--worn-size); mask-size: var(--worn-size); -webkit-mask-position: var(--mx, 0) var(--my, 0); mask-position: var(--mx, 0) var(--my, 0); }
.ink.red { color: var(--stamp-red); }
.ink.green { color: var(--stamp-green); }
.ink small { display: block; margin-top: 2px; font: 400 12px/1.2 var(--typed); }

/* ---------- stamp boxes and marks ---------- */
.stampable { position: relative; }
.stamp-box { display: grid; place-items: center; width: 132px; height: 52px; border: 2px dashed var(--rule); color: var(--ink-soft); font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.marks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.mark { position: absolute; display: grid; place-items: center; width: 112px; height: 34px; translate: -50% -50%; rotate: var(--tilt, 0deg); padding: 0; font: 400 30px/1 var(--display); white-space: nowrap; -webkit-font-smoothing: none; }
.mark small { display: none; }

/* ---------- the stamp bar ---------- */
.stampbar { position: fixed; z-index: 70; right: 0; top: 50%; display: none; width: var(--bar-w); translate: 0 -50%; transform: translateX(100%); transition: transform 0.28s ease-out; }
html.desk-mode .stampbar, html.locked .stampbar { display: block; }
.stampbar.out { transform: translateX(0); }
.bar-tab { position: absolute; right: 100%; top: 50%; translate: 0 -50%; display: flex; align-items: center; justify-content: center; width: 34px; height: 96px; padding: 0; border: var(--px) solid var(--ink); border-right: 0; background: var(--booth); color: var(--on-desk); font: 400 20px/1 var(--pixel); writing-mode: vertical-rl; -webkit-font-smoothing: none; }
.bar-rail { display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 14px 10px 10px; background: var(--booth-dark); border: var(--px) solid var(--ink); border-right: 0; box-shadow: inset var(--px) 0 0 var(--booth); }
.rivets { display: flex; justify-content: space-between; width: 100%; padding: 0 4px; }
.rivets i { width: 6px; height: 6px; background: var(--booth-light); box-shadow: 2px 2px 0 var(--ink); }
.stamp-btn { position: relative; padding: 0; border: 0; background: none; outline-offset: 2px; }
.stamp-btn .body { display: block; transition: none; }
.stamp-btn.p1 .body { translate: 0 4px; }
.stamp-btn.p2 .body { translate: 0 8px; }
.stamp-btn .word { position: absolute; display: grid; place-items: center; color: var(--paper); font: 400 30px/1 var(--display); text-shadow: 2px 2px 0 var(--ink); pointer-events: none; -webkit-font-smoothing: none; }
.stamp-btn.lined::after { content: ""; position: absolute; inset: -4px; border: 1px solid var(--cover-ink); pointer-events: none; }
.bar-note .touch { display: none; }
.bar-note { width: 100%; padding: 6px 6px 4px; background: var(--paper-deep); color: var(--ink); font: 400 20px/1 var(--pixel); text-align: center; -webkit-font-smoothing: none; }

/* ---------- intro: the passport ---------- */
.intro { position: fixed; inset: 0; z-index: 50; overflow: auto; display: grid; place-items: center; background: var(--wood-2) var(--wood-tile); background-size: var(--wood-size); image-rendering: pixelated; color: var(--on-desk); transition: opacity 0.4s ease; padding: 20px calc(var(--bar-w) + 24px) 24px var(--gut-l); }
.intro.leaving { opacity: 0; pointer-events: none; }
.intro-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; perspective: 2200px; }
.intro-say { max-width: 760px; min-height: 2em; font: 400 20px/1.2 var(--pixel); text-align: center; -webkit-font-smoothing: none; }
.intro-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 22px; }
.passport { position: relative; width: calc(var(--page-w) * 2); height: var(--page-h); translate: calc(var(--page-w) * -0.5 + var(--dx, 0px)) var(--dy, 0px); transition: translate 0.7s ease; touch-action: none; }
.passport.open { translate: var(--dx, 0px) var(--dy, 0px); cursor: grab; }
.passport.lining, .receipt.lining { transition: translate 0.35s ease-out; }
.passport.dragging, .receipt.dragging { transition: none; cursor: grabbing; }
.passport.gone { translate: -130vw var(--dy, 0px); transition: translate 0.45s ease-in; }
.passport:focus { outline: none; }
.passport:focus-visible { outline: 3px solid var(--cover-ink); outline-offset: 4px; }
.pp-page { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; background: var(--paper-deep); color: var(--ink); box-shadow: var(--px) var(--px) 0 var(--shade); }
.pp-cover { position: absolute; left: 50%; top: 0; z-index: 2; width: 50%; height: 100%; transform-style: preserve-3d; transform-origin: 0 50%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
.passport.open .pp-cover { transform: rotateY(-180deg); }
.pp-front, .pp-back { position: absolute; inset: 0; backface-visibility: hidden; }
.pp-front { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--cover); border: var(--px) solid var(--cover-edge); color: var(--cover-ink); box-shadow: var(--px) var(--px) 0 var(--shade); cursor: pointer; }
.pp-front b { font: 400 40px/1 var(--display); -webkit-font-smoothing: none; }
.pp-front span { font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.pp-back { transform: rotateY(180deg); padding: 14px 16px 12px; background: var(--paper-deep); color: var(--ink); border-right: 2px solid var(--rule); }
.pp-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }
.pp-head span:last-child { font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.pp-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
.pp-photo { align-self: start; border: 2px solid var(--ink); background: var(--paper); }
.fields { display: grid; gap: 3px; align-content: start; }
.fields dt { font: 400 20px/0.9 var(--display); color: var(--ink-soft); -webkit-font-smoothing: none; }
.fields dd { font: 700 14px/1.2 var(--typed); overflow-wrap: anywhere; }
.pp-mrz { margin-top: 10px; padding-top: 6px; border-top: 1px dashed var(--rule); font: 400 13px/1.45 var(--typed); white-space: nowrap; overflow: hidden; }
.visa-page { position: relative; height: 100%; padding: 14px 16px; }
.visa-page h2 { font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }
.visa-lines { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; margin-top: 12px; }
.visa-lines dt { font: 400 20px/1 var(--display); color: var(--ink-soft); -webkit-font-smoothing: none; }
.visa-lines dd { font: 400 14px/1.3 var(--typed); }
.visa .stamp-box { position: absolute; right: 22px; top: 58%; }
.pp-stamps { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; margin-top: 14px; }

/* page turning */
.corner { position: absolute; right: 0; bottom: 0; z-index: 3; padding: 0; border: 0; background: none; }
.corner .spr { width: 18px; height: 18px; transition: width 0.12s steps(2), height 0.12s steps(2); }
.corner:hover .spr, .corner:focus-visible .spr, .paper:hover > .corner .spr, .pp-page:hover .corner .spr { width: 30px; height: 30px; }
.flip-out { animation: flipout 0.09s steps(2) forwards; }
@keyframes flipout { to { scale: 0.08 1; } }

/* ---------- scene: booth and desk, pinned while scrolling ---------- */
.scene { position: relative; }
.stage { position: sticky; top: 0; display: flex; flex-direction: column; overflow: hidden; }

.booth { position: relative; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "win links side" "plate plate side"; gap: 8px 24px; align-items: start; padding: 10px var(--gut-r) 10px var(--gut-l); background: var(--booth-dark); color: var(--on-desk); border-bottom: var(--px) solid var(--ink); }
.window-wrap { grid-area: win; position: relative; overflow: hidden; width: 294px; border: var(--px) solid var(--ink); background: var(--booth); }
.window { position: relative; height: 186px; overflow: hidden; background: var(--booth-light); }
.window .skyline { position: absolute; left: 0; top: 0; }
.window .applicant { position: absolute; left: 50%; bottom: 6px; translate: -50% 0; }
.window .ledge { position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: var(--wood-3); border-top: var(--px) solid var(--wood-4); }
.board { display: flex; gap: 1px; padding: 4px 3px; background: var(--ink); }
.tile { display: inline-grid; place-items: center; width: 13px; height: 22px; background: var(--booth-dark); color: var(--cover-ink); font: 400 20px/1 var(--pixel); background-image: linear-gradient(transparent 10px, var(--ink) 10px 11px, transparent 11px); -webkit-font-smoothing: none; }
.shutter { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: repeating-linear-gradient(var(--booth-light) 0 9px, var(--booth) 9px 12px); border-bottom: 6px solid var(--ink); color: var(--ink); }
.shutter span, .shutter .btn-quiet { padding: 3px 8px; background: var(--paper-deep); font: 400 20px/1 var(--pixel); -webkit-font-smoothing: none; }
.shutter.up { visibility: hidden; }
.nameplate { grid-area: plate; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; justify-self: start; max-width: 100%; padding: 8px 14px 9px; background: var(--cover-ink); color: var(--ink); border: var(--px) solid var(--ink); box-shadow: inset var(--px) var(--px) 0 var(--wood-5); }
.nameplate h1 { font: 400 40px/0.9 var(--display); -webkit-font-smoothing: none; }
.nameplate .tagline { max-width: 60ch; font: 400 16px/1.35 var(--sans); }
.booth-main { grid-area: links; min-width: 0; padding-top: 4px; }
.denied-note { margin-top: 10px; max-width: 46ch; font: 400 16px/1.4 var(--sans); color: var(--cover-ink); }
.booth-links, .ask { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.ask { margin-top: 12px; }
.bubble { margin-top: 8px; max-width: 56ch; padding: 8px 12px; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--sans); }
.booth-side { grid-area: side; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; text-align: right; }
.clock { font: 400 30px/1 var(--pixel); color: var(--cover-ink); -webkit-font-smoothing: none; }
.radio { display: flex; gap: 8px; align-items: center; }
.aside { position: absolute; right: var(--gut-r); top: calc(100% + 8px); z-index: 30; max-width: 280px; padding: 8px 12px; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--sans); box-shadow: var(--px) var(--px) 0 var(--shade); pointer-events: none; }
.owner { display: inline-flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.owner .note { font: 400 15px/1.3 var(--sans); }

.desk { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--wood-2) var(--wood-tile); background-size: var(--wood-size); image-rendering: pixelated; color: var(--on-desk); }
.counter { position: absolute; z-index: 4; left: 0; right: 0; top: 0; height: 40px; display: flex; gap: 10px; align-items: center; padding: 0 var(--gut-r) 0 var(--gut-l); background: var(--wood-3); border-bottom: var(--px) solid var(--ink); box-shadow: inset 0 var(--px) 0 var(--wood-4); }
.counter.ready { background: var(--wood-4); color: var(--ink); }
.counter-label { font: 400 20px/1 var(--pixel); -webkit-font-smoothing: none; }
.put-away { display: flex; gap: 6px; overflow-x: auto; }
.chip { flex: none; padding: 3px 8px 2px; border: 2px solid var(--ink); background: var(--paper-deep); color: var(--ink); font: 400 20px/1 var(--pixel); -webkit-font-smoothing: none; }
.lamp { position: absolute; z-index: 5; right: 52px; top: 48px; pointer-events: none; }
.lamp .on { display: none; }
.desk.lamp-on .lamp .on { display: block; }
.desk.lamp-on .lamp .off { display: none; }
.pool { position: absolute; z-index: 1; right: 0; top: 150px; display: none; pointer-events: none; }
.desk.lamp-on .pool { display: block; }
.ring { position: absolute; z-index: 1; right: 26%; bottom: 22%; opacity: 0.55; pointer-events: none; }
.sticker { position: absolute; z-index: 3; cursor: grab; touch-action: none; user-select: none; }
.sticker:hover { animation: wiggle 0.14s steps(1); }
@keyframes wiggle { 50% { rotate: 6deg; } }
.envelope { position: absolute; z-index: 2; left: var(--gut-l); top: 64px; transform-origin: 50% 100%; transition: transform 0.4s steps(4), opacity 0.2s linear 0.3s; }
.envelope.folded { transform: translateX(-140%) scaleY(0.25); opacity: 0; }
.env-stamp { position: absolute; left: 22px; bottom: 30px; --tilt: -6deg; background: var(--manila); white-space: nowrap; }
.unpack-hint { position: absolute; z-index: 3; left: var(--gut-l); top: 196px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; max-width: 240px; font: 400 16px/1.4 var(--sans); }

/* papers */
.paper { position: absolute; z-index: 10; width: 300px; max-width: calc(100% - 16px); background: var(--paper); color: var(--ink); line-height: 1.45; rotate: var(--tilt, 0deg); box-shadow: var(--px) var(--px) 0 var(--shade); cursor: grab; touch-action: none; user-select: none; image-rendering: auto; transition: rotate 0.12s ease-out, scale 0.12s ease-out, box-shadow 0.12s ease-out; }
.paper.moving { transition: left 0.32s ease-out, top 0.32s ease-out, opacity 0.2s ease-out, scale 0.32s ease-out, rotate 0.12s ease-out; }
.paper.held, .sticker.held { z-index: 900 !important; scale: 1.02; rotate: 0deg; box-shadow: var(--lift) var(--lift) 0 var(--shade); cursor: grabbing; }
.paper.packed { opacity: 0; scale: 0.5; pointer-events: none; visibility: hidden; transition: left 0.3s ease-in, top 0.3s ease-in, opacity 0.2s ease-in 0.1s, scale 0.3s ease-in, visibility 0s linear 0.3s; }
.paper.leaving { translate: 0 -60px; opacity: 0; transition: translate 0.2s ease-in, opacity 0.2s ease-in; }
.paper.away { display: none; }
.paper:focus { outline: none; }
.paper:focus-visible { outline: 3px solid var(--cover-ink); outline-offset: 2px; }
.pad { padding: 12px 52px 14px 16px; }
.doc-title { margin-bottom: 8px; font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }

.p-id { width: 350px; background: var(--paper-deep); border: 2px solid var(--ink); }
.p-id .pad { padding-right: 54px; }
.id-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.id-photo { border: 2px solid var(--ink); background: var(--paper); align-self: start; }
.p-diploma { width: 280px; border: 6px double var(--ink); background: var(--field); }
.p-diploma .pad { padding-right: 44px; }
.dip-line { font: 400 13px/1.38 var(--typed); }
.dip-line + .dip-line { margin-top: 5px; }
.dip-line b { font-weight: 700; }
.p-diploma .seal { margin: 0 0 8px; --tilt: -4deg; }
.p-honours { width: 280px; }
.p-honours .pad { padding-right: 16px; }
.honour { padding-block: 6px; border-top: 1px solid var(--rule); font: 400 14px/1.4 var(--sans); }
.honour:first-of-type { border-top: 0; padding-top: 0; }
.honour b { font-weight: 600; }
.honour p { color: var(--ink-soft); }

.p-case { width: 250px; padding: 34px 12px 12px; background: var(--manila); border: 2px solid var(--manila-deep); }
.folder-tab { position: absolute; left: var(--tab-x, 8px); top: -24px; height: 24px; max-width: 234px; padding: 3px 10px 0; overflow: hidden; text-overflow: ellipsis; background: var(--manila); border: 2px solid var(--manila-deep); border-bottom: 0; font: 400 20px/1 var(--display); white-space: nowrap; -webkit-font-smoothing: none; }
.p-case.hot { border-color: var(--stamp-green); }
.p-case.hot .folder-tab { background: var(--cover-ink); border-color: var(--stamp-green); }
.folder-face { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding-right: 22px; }
.folder-face b { display: block; font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.folder-face .when { font: 400 14px/1.3 var(--typed); }
.p-case .clip { position: absolute; right: -9px; top: 40px; }
.p-case .mini-stamp { margin-top: 8px; --tilt: -4deg; }
.peek { position: absolute; right: 30px; bottom: -22px; z-index: -1; padding: 3px 8px 3px; background: var(--field); border: 2px solid var(--ink); font: 400 20px/1 var(--display); translate: 0 -18px; transition: translate 0.12s steps(2); -webkit-font-smoothing: none; }
.p-case:hover .peek, .p-case:focus-visible .peek { translate: 0 0; }
.p-case.open { width: 520px; padding: 0; background: var(--paper); border: 0; display: flex; flex-direction: column; cursor: default; }
.p-case.open .paper-head { cursor: grab; }
.paper-head { display: flex; gap: 10px; align-items: center; padding: 6px 10px 5px 14px; background: var(--manila); border-bottom: 2px solid var(--ink); }
.paper-head h2 { flex: 1; min-width: 0; font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }
.paper-head .pg { font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.paper-head .close { padding: 3px 8px 2px; border: 2px solid var(--ink); background: var(--field); font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.paper-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 36px; cursor: grab; font: 400 16px/1.5 var(--sans); }
.case-top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.case-top > div { flex: 1 1 200px; min-width: 0; }
.case-top h3 { font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }
.case-top .meta { margin-top: 4px; font: 400 15px/1.4 var(--sans); color: var(--ink-soft); }
.line { margin-top: 10px; font: 600 17px/1.45 var(--sans); }
.points { margin-top: 10px; }
.points li + li { margin-top: 6px; }
.stack { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--rule); font: 400 15px/1.6 var(--sans); }
.stack-label { font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.stack mark, .sk.hot, .sk.used { background: var(--mark-hash); color: var(--ink); }
.demo-zone { margin-top: 14px; }
.demo-zone .btn-main { font-family: var(--display); }
.demo-box { margin-top: 10px; padding: 12px; border: 2px solid var(--ink); background: var(--field); cursor: auto; user-select: text; }

/* skills drawer: the front always shows, raised above the desk edge */
.drawer { position: absolute; z-index: 6; right: 12px; bottom: 0; width: min(620px, 60%); transform: translateY(var(--drawer-y, 100%)); }
.drawer.sliding { transition: transform 0.24s ease-out; }
.drawer-box { max-height: 52vh; overflow: auto; padding: 12px; background: var(--wood-3); border: var(--px) solid var(--ink); border-top: 0; border-bottom: 0; }
.skills-card { padding: 12px 14px; background: var(--paper); color: var(--ink); }
.skills-card .note { margin-bottom: 8px; font: 400 14px/1.4 var(--typed); color: var(--ink-soft); }
.sk-group + .sk-group { margin-top: 10px; }
.sk-group h3 { font: 400 20px/1.2 var(--display); -webkit-font-smoothing: none; }
.sk { margin: 4px 6px 0 0; padding: 1px 6px; border: 1px solid var(--rule); background: none; font: 400 14px/1.5 var(--typed); }
.sk.hot { border-color: var(--ink); }
.drawer-front { display: flex; justify-content: flex-end; padding-right: 14px; align-items: center; height: 46px; padding-left: 14px; background: var(--wood-4); border: var(--px) solid var(--ink); border-bottom: 0; box-shadow: inset 0 var(--px) 0 var(--wood-5), 0 calc(var(--px) * -1) 0 var(--shade); }
.handle { display: flex; gap: 10px; align-items: center; padding: 4px 10px; border: 0; background: none; color: var(--ink); font: 400 20px/1 var(--pixel); cursor: ns-resize; touch-action: none; -webkit-font-smoothing: none; }

/* ---------- entry record ---------- */
.record-sec { position: relative; z-index: 1; padding: 56px 0 calc(110px + var(--safe-b)); background: var(--paper); color: var(--ink); }
.record-wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px 48px; max-width: 1080px; margin: 0 auto; padding-left: var(--gut-l); padding-right: calc(var(--gut-r) + var(--bar-w)); }
.record-intro h2 { font: 400 40px/1 var(--display); -webkit-font-smoothing: none; }
.record-intro p { margin-top: 10px; font: 400 16px/1.5 var(--sans); color: var(--ink-soft); }
.printer-area { position: relative; }
.printer { position: relative; z-index: 2; display: flex; align-items: center; justify-content: flex-end; gap: 12px; width: 400px; max-width: 100%; height: 64px; padding: 0 14px 12px; background: var(--booth); border: var(--px) solid var(--ink); box-shadow: inset var(--px) var(--px) 0 var(--booth-light); }
.printer::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 8px; height: 6px; background: var(--ink); }
.printer .led { width: 9px; height: 9px; background: var(--rule); }
.printer-area.printed .led { background: var(--green-light); }
.printer .btn-quiet { color: var(--on-desk); }
.receipt { position: relative; z-index: 1; width: 360px; max-width: calc(100% - 40px); max-height: 30px; margin: -8px 0 0 20px; overflow: hidden; background: var(--field); translate: var(--dx, 0px) var(--dy, 0px); }
.printer-area.printed .receipt { max-height: none; overflow: visible; cursor: grab; touch-action: none; box-shadow: var(--px) var(--px) 0 var(--shade); }
.receipt:focus { outline: none; }
.receipt:focus-visible { outline: 3px solid var(--stamp-green); outline-offset: 3px; }
.rec { padding: 18px 18px 16px; font: 400 14px/1.5 var(--typed); }
.rec .r-title { font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }
.rec .r-h { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--rule); font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.rec dl { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 2px 10px; margin-top: 10px; }
.rec dt { font: 400 20px/1.05 var(--display); color: var(--ink-soft); -webkit-font-smoothing: none; }
.rec ul { margin-top: 4px; }
.rec .stamp-box { margin: 16px 0 0 auto; }
.perf { position: relative; display: block; width: 100%; height: 22px; padding: 0; border: 0; background: none; cursor: ew-resize; touch-action: none; }
.perf::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px); }
.perf::after { content: ""; position: absolute; left: 0; top: 4px; width: calc(var(--tear, 0) * 100%); height: 14px; background: var(--paper); clip-path: polygon(0 50%, 4% 0, 8% 60%, 12% 10%, 16% 70%, 20% 0, 24% 55%, 28% 10%, 32% 65%, 36% 0, 40% 60%, 44% 15%, 48% 70%, 52% 0, 56% 55%, 60% 10%, 64% 65%, 68% 0, 72% 60%, 76% 15%, 80% 70%, 84% 0, 88% 55%, 92% 10%, 96% 60%, 100% 30%, 100% 100%, 0 100%); }
.perf .lab { position: absolute; right: 8px; top: -2px; font: 400 20px/1 var(--display); color: var(--ink-soft); -webkit-font-smoothing: none; }
.slip { padding: 14px 18px 18px; background: var(--field); rotate: calc(var(--tear, 0) * 4deg); translate: 0 calc(var(--tear, 0) * 8px); transform-origin: 100% 0; }
.slip .s-title { font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }
.slip .email { display: block; margin-top: 6px; font: 700 17px/1.3 var(--typed); user-select: all; overflow-wrap: anywhere; }
.slip .row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 8px; font: 400 15px/1.3 var(--typed); }
.slip .btn-quiet { font: 400 20px/1 var(--display); -webkit-font-smoothing: none; }
.slip.loose { position: absolute; z-index: 5; width: 360px; max-width: calc(100% - 16px); rotate: var(--tilt, 3deg); translate: none; box-shadow: var(--px) var(--px) 0 var(--shade); cursor: grab; touch-action: none; clip-path: polygon(0 6px, 3% 0, 6% 6px, 9% 0, 12% 6px, 15% 0, 18% 6px, 21% 0, 24% 6px, 27% 0, 30% 6px, 33% 0, 36% 6px, 39% 0, 42% 6px, 45% 0, 48% 6px, 51% 0, 54% 6px, 57% 0, 60% 6px, 63% 0, 66% 6px, 69% 0, 72% 6px, 75% 0, 78% 6px, 81% 0, 84% 6px, 87% 0, 90% 6px, 93% 0, 96% 6px, 100% 0, 100% 100%, 0 100%); padding-top: 18px; }
.slip.loose.held { box-shadow: var(--lift) var(--lift) 0 var(--shade); scale: 1.02; rotate: 0deg; }
.receipt.torn .perf { visibility: hidden; height: 10px; }
.record-sec .foot { max-width: 1080px; margin: 64px auto 0; padding: 22px var(--gut-r) 0 var(--gut-l); border-top: 2px solid var(--ink); font: 400 14px/1.4 var(--typed); color: var(--ink-soft); }

/* ---------- bottom pill nav ---------- */
.pill { position: fixed; z-index: 60; left: 50%; bottom: calc(16px + var(--safe-b)); translate: -50% 0; display: none; gap: 4px; align-items: center; padding: 4px; background: var(--booth-dark); color: var(--on-desk); border: 2px solid var(--ink); border-radius: 999px; box-shadow: var(--px) var(--px) 0 var(--shade); }
html.desk-mode .pill { display: flex; }
html.locked .pill { display: none; }
.pill button { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; }
.pill button:hover { background: var(--booth); }
.pill .area { min-width: 132px; text-align: center; font: 400 20px/1 var(--pixel); -webkit-font-smoothing: none; }

/* demos keep a code face inside their boxes */
.demo-box, .demo-box input, .demo-box textarea, .demo-box button { font-family: var(--mono); }
.demo-label { margin-bottom: 10px; font: 400 13px/1.5 var(--mono); color: var(--ink-soft); }
.demo-note { margin-top: 8px; font: 400 13px/1.5 var(--mono); color: var(--ink-soft); }
.demo-field { display: block; margin: 10px 0 4px; font: 500 13px/1.4 var(--mono); }
.demo-input, .demo-num { padding: 6px 8px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font: 400 13px/1.4 var(--mono); }
.demo-input { width: 100%; }
.demo-num { width: 5.5em; }
.demo-doc { padding: 8px 10px; background: var(--paper); border: 1px dashed var(--rule); font: 400 13px/1.5 var(--mono); }
.demo-out { margin-top: 12px; font: 400 13px/1.5 var(--mono); }
.demo-out ul, .demo-out p { margin-top: 8px; }
.demo-out .ink { font-family: var(--display); }
.demo-box .btn-quiet { font: 400 13px/1.4 var(--mono); }
.demo-picks { display: flex; flex-wrap: wrap; gap: 8px; }
.demo-pick { padding: 4px 10px; border: 2px solid var(--ink); background: var(--paper); font: 400 13px var(--mono); }
.demo-pick[aria-pressed="true"] { background: var(--ink); color: var(--field); }
.demo-dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin-top: 10px; align-items: center; }
.demo-dl dt { font: 500 13px var(--mono); }
.demo-table { width: 100%; margin-top: 10px; border-collapse: collapse; font: 400 13px/1.5 var(--mono); }
.demo-table th, .demo-table td { padding: 4px 8px 4px 0; border-top: 1px solid var(--rule); text-align: left; vertical-align: top; }
.demo-table td:first-child { overflow-wrap: anywhere; }
.demo-table th { border-top: 0; font: 500 13px var(--mono); }
mark.m-ip { background: var(--mark-ip); }
mark.m-domain { background: var(--mark-domain); }
mark.m-hash { background: var(--mark-hash); }
.demo-table mark { color: var(--ink); padding: 0 2px; }
.ioc-wrap { position: relative; }
.ioc-hl, .ioc-in { width: 100%; margin: 0; padding: 8px 10px; border: 2px solid var(--ink); font: 400 13px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.ioc-hl { position: absolute; inset: 0; overflow: hidden; background: var(--paper); border-color: transparent; color: transparent; }
.ioc-hl mark { color: transparent; }
.ioc-in { position: relative; display: block; min-height: 120px; background: none; color: var(--ink); resize: none; overflow: hidden; }

/* ---------- list view ---------- */
.wrap { max-width: 1080px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.top { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; justify-content: space-between; padding-block: 16px; border-bottom: 2px solid var(--ink); }
.top .who { font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }
.top nav { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.top .owner .note { color: var(--stamp-red); }
.hero { position: relative; padding-block: clamp(32px, 7vw, 72px) clamp(28px, 5vw, 56px); }
.hero h1 { font: 400 60px/0.95 var(--display); -webkit-font-smoothing: none; }
.hero .tagline { margin-top: 14px; max-width: 34ch; font: 600 22px/1.35 var(--sans); text-wrap: balance; }
.hero .summary { margin-top: 18px; max-width: 64ch; color: var(--ink-soft); }
.hero .entry { position: absolute; top: clamp(20px, 5vw, 56px); right: 0; --tilt: 6deg; }
.sec { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px 40px; padding-block: 36px; border-top: 2px dashed var(--rule); }
.sec > header h2 { font: 400 40px/1 var(--display); -webkit-font-smoothing: none; }
.sec > header p { margin-top: 8px; font: 400 15px/1.5 var(--sans); color: var(--ink-soft); }
.sec > div { min-width: 0; }
.list h3 { font: 400 30px/1.05 var(--display); -webkit-font-smoothing: none; }
.list .case { padding-block: 20px; border-top: 1px solid var(--rule); }
.list .case:first-child { padding-top: 0; border-top: 0; }
.list .meta { margin-top: 4px; font: 400 15px/1.5 var(--sans); color: var(--ink-soft); }
.list .case li + li { margin-top: 6px; }
.list .case ul { margin-top: 10px; }
.list .honour { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 2px 14px; padding-block: 10px; font-size: 17px; }
.list .honour .yr { color: var(--ink-soft); }
.skills { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px 20px; }
.skills dt { font: 400 20px/1.3 var(--display); -webkit-font-smoothing: none; }
.list .email { font: 600 22px/1.3 var(--sans); user-select: all; overflow-wrap: anywhere; }
.list .row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.list .links { margin-top: 8px; }
.plain { padding-left: 1.1em; }
.foot { font: 400 14px/1.4 var(--sans); color: var(--ink-soft); }
.list .foot { padding-block: 22px 34px; border-top: 2px solid var(--ink); }

/* amend mode */
.f { display: inline-block; min-width: 3em; padding: 0 4px; background: var(--field); box-shadow: inset 0 -1px 0 var(--ink); cursor: text; }
.f.block { display: block; }
.f:empty::before { content: attr(data-ph); color: var(--ink-soft); }
.mini { margin: 6px 8px 0 0; padding: 2px 8px; border: 1px solid var(--ink); background: none; font: 400 20px/1 var(--pixel); -webkit-font-smoothing: none; }
.mini.add { border-style: dashed; }
.edit-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 6px; }
.edit-row > .lab { min-width: 150px; font: 400 20px/1 var(--pixel); color: var(--ink-soft); -webkit-font-smoothing: none; }
.edit-point { margin-bottom: 12px; }

/* ---------- part 5: compact booth, fitted desk, drag-out stamps, wood under the record ---------- */
html, body { overflow-x: clip; }
html { scrollbar-width: auto; scrollbar-color: var(--wood-4) var(--wood-1); }
html::-webkit-scrollbar { width: 12px; height: 12px; background: var(--wood-1); }
html::-webkit-scrollbar-track { background: var(--wood-1); }
html::-webkit-scrollbar-thumb { background: var(--wood-4); border: 2px solid var(--ink); border-radius: 0; }
html::-webkit-scrollbar-thumb:hover { background: var(--wood-5); }
html::-webkit-scrollbar-button { display: none; }
.paper-body, .drawer-box, .demo-box, .put-away, .intro { scrollbar-width: thin; scrollbar-color: var(--ink-soft) var(--paper-deep); }
.paper-body::-webkit-scrollbar, .drawer-box::-webkit-scrollbar, .demo-box::-webkit-scrollbar, .put-away::-webkit-scrollbar, .intro::-webkit-scrollbar { width: 8px; height: 8px; background: var(--paper-deep); }
.paper-body::-webkit-scrollbar-track, .drawer-box::-webkit-scrollbar-track, .demo-box::-webkit-scrollbar-track, .put-away::-webkit-scrollbar-track, .intro::-webkit-scrollbar-track { background: var(--paper-deep); }
.paper-body::-webkit-scrollbar-thumb, .drawer-box::-webkit-scrollbar-thumb, .demo-box::-webkit-scrollbar-thumb, .put-away::-webkit-scrollbar-thumb, .intro::-webkit-scrollbar-thumb { background: var(--ink-soft); border-radius: 0; }
.paper-body::-webkit-scrollbar-thumb:hover, .drawer-box::-webkit-scrollbar-thumb:hover, .demo-box::-webkit-scrollbar-thumb:hover { background: var(--ink); }
.paper-body::-webkit-scrollbar-button, .drawer-box::-webkit-scrollbar-button, .demo-box::-webkit-scrollbar-button, .put-away::-webkit-scrollbar-button, .intro::-webkit-scrollbar-button { display: none; }

/* booth: about 180px, window on the left, links with the nameplate right under them */
.booth { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "win main side"; gap: 0 22px; padding: 8px var(--gut-r) 8px var(--gut-l); }
.window { height: 132px; }
.window .applicant { top: 6px; bottom: auto; }
.booth-main { grid-area: main; display: flex; flex-direction: column; gap: 12px; padding-top: 2px; }
.plate-row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.nameplate { display: inline-block; width: fit-content; max-width: 100%; padding: 6px 12px 7px; background: var(--cover-ink); color: var(--ink); border: var(--px) solid var(--ink); box-shadow: inset var(--px) var(--px) 0 var(--wood-5), var(--px) var(--px) 0 var(--shade); }
.nameplate h1 { font: 400 40px/0.9 var(--display); -webkit-font-smoothing: none; }
.plate-row .tagline { flex: 1 1 260px; max-width: 58ch; font: 400 16px/1.35 var(--sans); color: var(--on-desk); }
.denied-note { margin-top: 0; }
.ask { margin-top: 0; }

/* the desk content sits in its own layer, so the stamp bar and pill always stay above it */
.stage { isolation: isolate; }
.paper { scale: var(--fit, 1); transform-origin: 0 0; }
.paper.held { scale: calc(var(--fit, 1) * 1.02); }
.paper.packed { scale: calc(var(--fit, 1) * 0.5); }
.p-case.open { scale: 1; width: 560px; }
.p-case.open .paper-body { padding-bottom: 28px; }
.p-case.open.held { scale: 1.02; }
.paper.nudge { transition: left 0.2s ease-out, top 0.2s ease-out, rotate 0.12s ease-out; }
.p-case.open .paper-body { overflow: auto; }
.p-diploma .doc-title { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.p-diploma .seal { margin: 0; font-size: 20px; }
.p-honours { width: 320px; }
.counter-label { display: none; }
.counter-hint { font: 400 20px/1 var(--pixel); color: var(--on-desk); -webkit-font-smoothing: none; }
.counter.ready .counter-hint { color: var(--ink); }
.lamp { right: 40px; top: 46px; z-index: 5; }
.pool { z-index: 700; right: 150px; top: 96px; }

/* the skills drawer: a full-width drawer whose front always shows along the bottom edge */
.drawer { left: 0; right: 0; width: auto; translate: none; }
.drawer-front { justify-content: flex-start; height: 68px; padding: 0 0 0 var(--gut-l); border-left: 0; border-right: 0; }
.drawer-front .handle { margin-top: -18px; }
.drawer-box { max-height: var(--drawer-max, 52vh); padding: 14px var(--gut-r) 76px var(--gut-l); border-left: 0; border-right: 0; }
.sk-cols { columns: 4 230px; column-gap: 28px; }
.sk-group { break-inside: avoid; margin-bottom: 10px; }
.sk-group + .sk-group { margin-top: 0; }

/* the stamps: slots on the bar, and the one being held */
.stamp-btn { touch-action: none; cursor: grab; }
.stamp-btn .stamp-art, .held-stamp .stamp-art { position: relative; display: block; }
.stamp-btn .word, .held-stamp .word { position: absolute; display: grid; place-items: center; color: var(--paper); font: 400 30px/1 var(--display); text-shadow: 2px 2px 0 var(--ink); pointer-events: none; -webkit-font-smoothing: none; }
.stamp-btn.empty .stamp-art { visibility: hidden; }
.stamp-btn.empty { background: var(--ink); box-shadow: inset 4px 4px 0 var(--shade); }
.held-stamp { position: fixed; z-index: 90; pointer-events: none; filter: drop-shadow(0 0 0 transparent); }
.held-stamp.lifted { translate: -4px -6px; filter: drop-shadow(12px 12px 0 var(--shade)); }
.held-stamp.glide { transition: left 0.2s ease-out, top 0.2s ease-out, translate 0.2s ease-out; }
.held-stamp.p1 .stamp-art { translate: 0 4px; }
.held-stamp.p2 { translate: 0 2px; filter: drop-shadow(2px 2px 0 var(--shade)); }
.held-stamp.p2 .stamp-art { translate: 0 8px; }
.ink-preview { position: fixed; z-index: 85; opacity: 0.25; pointer-events: none; }
.stamp-box.inked { color: transparent; }
.bar-note { font-size: 20px; }

/* passport cover name in the document face */
.pp-front span { font: 400 30px/1 var(--display); -webkit-font-smoothing: none; }
.passport.open { cursor: default; }

/* the entry record sits on the same wood, with a desk edge */
.record-sec { background: var(--wood-2) var(--wood-tile); background-size: var(--wood-size); color: var(--on-desk); border-top: 8px solid var(--wood-3); box-shadow: inset 0 var(--px) 0 var(--wood-4); padding-bottom: calc(120px + var(--safe-b)); }
.record-intro p { color: var(--on-desk); }
.record-sec .foot { color: var(--on-desk); border-top-color: var(--wood-4); }
.receipt { color: var(--ink); translate: none; }
.printer-area.printed .receipt { cursor: default; touch-action: auto; }
.slip.loose { color: var(--ink); }


/* the passport as a book: the right-hand leaf turns around the spine */
.passport { perspective: 1600px; }
.passport:not(.open) .pp-cover { z-index: 5; }
.pp-leaf { position: absolute; left: 50%; top: 0; z-index: 3; width: 50%; height: 100%; transform-origin: 0 50%; transform-style: preserve-3d; transition: transform 0.32s steps(4, end); }
.pp-leaf.turned { transform: rotateY(-180deg); }
.pp-leaf.held-page { transition: none; }
.leaf-face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--paper-deep); color: var(--ink); box-shadow: var(--px) var(--px) 0 var(--shade); }
.leaf-back { transform: rotateY(180deg); border-right: 2px solid var(--rule); }
.pp-under { z-index: 1; }
.leaf-back .corner { right: auto; left: 0; }
.leaf-back .corner .spr { transform: scaleX(-1); }
.leaf-face:hover .corner .spr { width: 30px; height: 30px; }
.corner.fwd, .corner.back { cursor: ew-resize; touch-action: none; }
/* flat shading near the spine while the page is mid-turn, and a hard shadow line on the page beneath */
.leaf-face::after { content: ""; position: absolute; top: 0; bottom: 0; width: 22px; background: var(--shade); opacity: 0; pointer-events: none; }
.leaf-front::after { left: 0; }
.leaf-back::after { right: 0; }
.passport.turning .leaf-face::after { opacity: 0.35; }
.pp-under::before, .pp-back::before { content: ""; position: absolute; top: 0; bottom: 0; z-index: 2; width: 3px; background: var(--ink); opacity: 0; pointer-events: none; }
.pp-under::before { left: 0; }
.pp-back::before { right: 0; }
.passport.turning .pp-under::before, .passport.turning .pp-back::before { opacity: 0.45; }

.receipt { max-height: none; margin: 0; overflow: visible; }

.record-view { position: absolute; inset: 0; background: rgba(20, 15, 10, 0.72); }

.stage > .lamp { position: absolute; z-index: 30; display: block; pointer-events: none; }

/* case files: pages filled to the paper's height, and sheets turning over the left edge */

/* ---------- part 7: Thea's desk art, printer hand-off, contact screen ---------- */
:root { --sprite-scale: 3; --screen-text: #b9dcae; --fb-hi: #e5cc8e; --fb-folder: #bba167; --fb-ink: #1d1e0f; --fb-shade: #4e3d24; }
.art { image-rendering: pixelated; }

/* layers, back to front: booth, counter strip, desk, lamp, papers, held or open paper, stamp bar, pill */

.filebox { width: 162px; height: 138px; }
.box-all { left: 47px; top: 117px; bottom: auto; width: 71px; height: 18px; display: grid; place-items: center; padding: 0; color: var(--fb-ink); font: 400 10px/1 var(--pixel); text-decoration: none; }

.printer { width: 102px; height: 102px; z-index: 9; }

@keyframes blink7 { 50% { background: var(--ink); } }
.stage:has(.receipt) .printer .led { background: transparent; }
.feed { position: absolute; left: 30px; bottom: 72px; z-index: 1; width: 42px; height: var(--feed, 0px); background: repeating-linear-gradient(to bottom, var(--field) 0 6px, var(--rule) 6px 9px, var(--field) 9px 12px); border: 3px solid var(--fb-ink); border-bottom: 0; pointer-events: none; }

.envelope { z-index: 2; }

/* the record section */
.record-area { position: relative; min-height: 420px; }
.record-empty { padding: 18px 0; font: 400 16px/1.5 var(--sans); color: var(--on-desk); }

/* the contact screen */
.contact { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; }

.contact :focus-visible { outline: 2px solid var(--screen-text); outline-offset: 2px; }
.cm-x { position: absolute; z-index: 2; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 2px solid var(--ink); background: var(--paper-deep); color: var(--ink); font: 400 20px/1 var(--pixel); }

/* ---------- part 8: bigger computer, typing keys, browser, desk fixes, stamp tray ---------- */
:root { --bar-w: 0px; --crt: #37432f; --scan: rgba(0, 0, 0, 0.06); --key-bed: #2c2e1e; --key-cap: #e0cda2; --key-edge: #a0926b; --key-down: #c5b286; }

/* the browser on the screen */

.br-title { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 10px; background: var(--paper-deep); color: var(--ink); font: 400 20px/1 var(--pixel); -webkit-font-smoothing: none; }
.br-x { display: grid; place-items: center; width: 26px; height: 24px; padding: 0; border: 2px solid var(--ink); background: var(--field); color: var(--ink); font: 400 20px/1 var(--pixel); }

.br-load { height: 6px; background: transparent; }

.br-tiles { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 12px 14px; flex: 1; }

/* the desk: lamp pinned to the top-right corner, light just below and left of its shade */

/* ---------- phones and small tablets ---------- */
.phone-hint { display: none; }

<script id="fx">// Sounds (off until the visitor turns them on) and the split-flap board in the booth window.
window.FX = (function () {
  const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const VOLUME = { tick: 0.12, print: 0.3, lift: 0.42, settle: 0.45, tap: 0.45 };
  // the handling sounds are the most frequent, so they are the quietest, low-passed, with less pitch spread
  const SOFT = { lift: true, settle: true, tap: true };
  const GAP = { tick: 40, lift: 120 };
  const snd = { on: false, ctx: null, last: {}, bufs: {}, gain: null };
  try { snd.on = sessionStorage.getItem("cvp-sound") === "on"; } catch (err) { /* storage can be blocked */ }

  function ctx() {
    if (!snd.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      snd.ctx = new C();
      snd.gain = snd.ctx.createGain(); snd.gain.gain.value = 0.35; snd.gain.connect(snd.ctx.destination);
      // decode the embedded files once
      Object.keys(window.SOUNDS || {}).forEach((name) => {
        const b64 = window.SOUNDS[name].split(",")[1], bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        snd.ctx.decodeAudioData(bytes.buffer, (buf) => { snd.bufs[name] = buf; }, () => {});
      });
    }
    if (snd.ctx.state === "suspended") snd.ctx.resume();
    return snd.ctx;
  }
  const ALIAS = { rustle: "lift" };
  function play(name) {
    if (!snd.on) return;
    name = ALIAS[name] || name;
    const now = performance.now(), gap = GAP[name] || 60;
    if (snd.last[name] && now - snd.last[name] < gap) return;
    snd.last[name] = now;
    const c = ctx();
    if (!c || !snd.bufs[name]) return;
    const src = c.createBufferSource(), g = c.createGain();
    src.buffer = snd.bufs[name];
    // a little pitch variation so repeats do not sound mechanical: 3% for handling, 5% for the rest
    src.playbackRate.value = SOFT[name] ? 0.97 + Math.random() * 0.06 : 0.95 + Math.random() * 0.1;
    g.gain.value = VOLUME[name] || 1;
    if (SOFT[name]) {
      const lp = c.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 1700; lp.Q.value = 0.5;
      src.connect(lp); lp.connect(g);
    } else src.connect(g);
    g.connect(snd.gain);
    src.start();
  }
  function toggle() {
    snd.on = !snd.on;
    if (snd.on) ctx();
    try { sessionStorage.setItem("cvp-sound", snd.on ? "on" : "off"); } catch (err) { /* storage can be blocked */ }
    return snd.on;
  }

  function board(el, phrases, n) {
    el.innerHTML = Array.from({ length: n }, () => '<span class="tile">&nbsp;</span>').join("");
    const tiles = Array.from(el.children), cur = Array(n).fill(" ");
    let idx = -1, timer = null, running = false, paused = false, gen = 0;
    const list = (phrases || []).filter(Boolean);
    function set(i, c) { tiles[i].textContent = c === " " ? " " : c; cur[i] = c; }
    function show(text, instant) {
      const g = ++gen;
      text = String(text).toUpperCase().slice(0, n).padEnd(n, " ");
      if (instant || reduced()) { for (let i = 0; i < n; i++) set(i, text[i]); next(); return; }
      let busy = 0;
      for (let i = 0; i < n; i++) {
        if (cur[i] === text[i]) continue;
        busy++;
        // each tile drops to blank and then lands on its own letter, so no stray letters are ever shown
        const step = (k) => {
          if (g !== gen) return;
          if (k === 0 && cur[i] !== " ") { set(i, " "); play("tick"); setTimeout(() => step(1), 60); }
          else { set(i, text[i]); if (text[i] !== " ") play("tick"); if (--busy === 0) next(); }
        };
        setTimeout(() => step(0), text[i] === " " ? 0 : 60 + i * 26);
      }
      if (busy === 0) next();
    }
    function next() {
      clearTimeout(timer);
      if (!running || !list.length) return;
      timer = setTimeout(() => {
        if (paused) { next(); return; }
        idx = (idx + 1) % list.length;
        show(list[idx]);
      }, idx < 0 ? 0 : 3200);
    }
    el.addEventListener("mouseenter", () => { paused = true; });
    el.addEventListener("mouseleave", () => { paused = false; });
    return {
      start() { if (running) return; running = true; next(); },
      blank() { running = false; clearTimeout(timer); idx = -1; show("", true); },
      get running() { return running; },
    };
  }

  return { play: play, toggle: toggle, board: board, get soundOn() { return snd.on; } };
})();
</script>
<script id="demos">// Small demos that run fully in the browser. No network calls, no keys.
window.DEMOS = (function () {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const stamp = (text, colour) => '<span class="ink ' + colour + ' thud">' + esc(text) + "</span>";
  const label = (text) => '<p class="demo-label">' + esc(text) + "</p>";

  // --- IOC Enricher: find IPs, domains and hashes with regular expressions ---
  const IOC = /\b(?:[a-f0-9]{64}|[a-f0-9]{40}|[a-f0-9]{32})\b|\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b|\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}\b/gi;
  function iocType(v) {
    if (/^[a-f0-9]+$/i.test(v)) return v.length === 64 ? ["hash", "SHA-256 hash"] : v.length === 40 ? ["hash", "SHA-1 hash"] : ["hash", "MD5 hash"];
    return /^[\d.]+$/.test(v) ? ["ip", "IP address"] : ["domain", "Domain"];
  }
  function ioc(el) {
    const sample = "ALERT 03:14 UTC: workstation FIN-07 made repeated connections to 203.0.113.45 and 192.0.2.118 after a user opened invoice-update.example.net.\n" +
      "Dropped file MD5: 9e107d9d372bb6826bd81d3542a419d6\nSecond stage fetched from cdn.login-check.example.org, SHA-256 e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855";
    el.innerHTML = label("Demo with a made-up alert. Edit or paste your own text.") +
      '<div class="ioc-wrap"><div class="ioc-hl" aria-hidden="true"></div><textarea class="ioc-in" id="ioc-input" aria-label="Alert text" spellcheck="false"></textarea></div>' +
      '<div class="scroll-x"><table class="demo-table"><thead><tr><th>Indicator</th><th>Type</th></tr></thead><tbody></tbody></table></div>' +
      '<p class="demo-note">In the real tool, each of these is looked up on VirusTotal, AbuseIPDB and Shodan.</p>';
    const input = el.querySelector("textarea"), hl = el.querySelector(".ioc-hl"), body = el.querySelector("tbody");
    function scan() {
      const text = input.value, seen = new Map();
      let html = "", last = 0, m;
      IOC.lastIndex = 0;
      while ((m = IOC.exec(text))) {
        const t = iocType(m[0]);
        html += esc(text.slice(last, m.index)) + '<mark class="m-' + t[0] + '">' + esc(m[0]) + "</mark>";
        last = m.index + m[0].length;
        if (!seen.has(m[0].toLowerCase())) seen.set(m[0].toLowerCase(), [m[0], t]);
      }
      hl.innerHTML = html + esc(text.slice(last)) + "\n";
      input.style.height = "auto";
      input.style.height = input.scrollHeight + 4 + "px";
      body.innerHTML = seen.size
        ? Array.from(seen.values()).map((x) => '<tr><td><mark class="m-' + x[1][0] + '">' + esc(x[0]) + "</mark></td><td>" + x[1][1] + "</td></tr>").join("")
        : '<tr><td colspan="2">No indicators found in this text.</td></tr>';
    }
    input.value = sample;
    input.addEventListener("input", scan);
    scan();
  }

  // --- Scure: simple local checks on a URL ---
  const BAD_TLDS = ["zip", "mov", "xyz", "top", "click", "country", "gq", "tk", "ml", "cf", "work"];
  function checkUrl(raw) {
    const fired = [];
    let u;
    try { u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : "https://" + raw); } catch (err) { return null; }
    const host = u.hostname, labels = host.split(".");
    if (u.protocol === "http:") fired.push("Uses http instead of https");
    if (/^[\d.]+$/.test(host) || host.includes(":")) fired.push("Uses an IP address instead of a domain name");
    if (raw.replace(/^[a-z][a-z0-9+.-]*:\/\//i, "").includes("@")) fired.push("Contains an @, which can hide the real destination");
    if (/xn--/.test(host) || /[^\x00-\x7f]/.test(raw) || labels.some((l) => /[a-z]\d[a-z]|[a-z]{3}[01]$/.test(l))) fired.push("Has lookalike characters in the name");
    if (labels.length > 4 || host.length > 40) fired.push("Has a very long chain of subdomains");
    if (BAD_TLDS.includes(labels[labels.length - 1])) fired.push("Ends in a top-level domain often used for abuse");
    return fired;
  }
  function scure(el) {
    el.innerHTML = label("Demo only. The real app checks VirusTotal, Google Safe Browsing, URLScan.io and a sandboxed browser.") +
      '<label class="demo-field" for="scure-url">Link to check</label><input class="demo-input" id="scure-url" type="text" spellcheck="false" autocomplete="off">' +
      '<div class="demo-out" aria-live="polite"></div>';
    const input = el.querySelector("input"), out = el.querySelector(".demo-out");
    function run() {
      const raw = input.value.trim(), fired = raw ? checkUrl(raw) : null;
      if (!raw) { out.innerHTML = "<p>Type a link to check it.</p>"; return; }
      if (!fired) { out.innerHTML = "<p>That does not look like a link.</p>"; return; }
      out.innerHTML = (fired.length ? stamp("Suspicious", "red") : stamp("Safe", "green")) +
        (fired.length ? "<ul>" + fired.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "<p>None of the six local checks fired.</p>");
    }
    input.value = "http://secure-login.account-update.verify.paypa1.example.zip/@signin";
    input.addEventListener("input", run);
    run();
  }

  // --- PolicyLens: change the rule, the clause is re-checked ---
  function policy(el) {
    const clauseDays = 21;
    el.innerHTML = label("Simplified demo of the re-check idea. The real system reads whole policies and contracts.") +
      '<p class="demo-field">Policy rule</p><p class="demo-doc">Invoices must be paid within <input class="demo-num" id="policy-days" type="number" min="1" max="120" value="30" aria-label="Days allowed by the rule"> days.</p>' +
      '<p><button class="btn-quiet" data-days="30">Set 30 days</button> <button class="btn-quiet" data-days="14">Set 14 days</button></p>' +
      '<p class="demo-field">Stored contract clause</p><p class="demo-doc">The Client shall pay each invoice within ' + clauseDays + " days of receipt.</p>" +
      '<div class="demo-out" aria-live="polite"></div>';
    const input = el.querySelector("input"), out = el.querySelector(".demo-out");
    function run() {
      const days = parseInt(input.value, 10);
      if (!days) { out.innerHTML = "<p>Enter a number of days.</p>"; return; }
      out.innerHTML = clauseDays <= days
        ? stamp("Complies", "green") + "<p>" + clauseDays + " days is within the " + days + " days the rule allows.</p>"
        : stamp("Violates", "red") + "<p>The clause allows " + clauseDays + " days, but the rule now allows only " + days + ". This contract would be flagged for the legal team.</p>";
    }
    input.addEventListener("input", run);
    el.addEventListener("click", (ev) => { const b = ev.target.closest("[data-days]"); if (b) { input.value = b.dataset.days; run(); } });
    run();
  }

  // --- S.H.I.E.L.D: sort a written report with keyword rules ---
  const REPORTS = [
    "Control, I have a man collapsed near the lift lobby on level 3. He is unconscious and not responding.",
    "There is an unattended black bag beside the east entrance. It has been there for about twenty minutes.",
    "A visitor says her wallet was stolen at the food court. She saw someone walk off quickly towards the car park.",
  ];
  const TYPES = [

  function shield(el) {

      const text = REPORTS[i], hit = TYPES.find((t) => t[1].test(text)) || ["Unclassified", null, "Low", "Ask the officer for more detail."];
      el.querySelectorAll(".demo-pick").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.r === i)));

        stamp(hit[2], hit[2] === "High" ? "red" : "green") + "</dd><dt>Suggested next step</dt><dd>" + hit[3] + "</dd></dl>";
    }
    el.addEventListener("click", (ev) => { const b = ev.target.closest("[data-r]"); if (b) run(+b.dataset.r); });
    run(0);
  }

  return { ioc: ioc, scure: scure, policy: policy, shield: shield, checkUrl: checkUrl };
})();

      if (!pageDrag.moved) return;
      // toward the spine: left for the visa leaf, right once it has been turned
      pageDrag.p = clamp((pageDrag.from === 0 ? -dx : dx) / pageDrag.w, 0, 1);
      const turned = pageDrag.from === 0 ? pageDrag.p : 1 - pageDrag.p;
      pageDrag.leaf.style.transform = "rotateY(" + -Math.round(turned * 8) * 22.5 + "deg)";
      return;
    }
    if (drawerDrag) {
      const dy = drawerDrag.sy - ev.clientY;
      if (Math.abs(dy) > 5) drawerDrag.moved = true;
      if (drawerDrag.moved && drawerDrag.h) { ui.drawer = clamp(drawerDrag.start + dy / drawerDrag.h, 0, 1); layoutDrawer(false); }
      return;
    }
    if (perfDrag) {
      const dx = Math.abs(ev.clientX - perfDrag.sx);
      if (dx > 6) perfMoved = true;
      if (perfMoved) { setTear(clamp(perfDrag.start + (dx / perfDrag.w) * 1.2, 0, 1)); if (ui.torn >= 0.85) { perfDrag = null; tearOff(); } }
      return;
    }
    if (!drag || ev.pointerId !== drag.id) return;
    const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 5) return;
      drag.moved = true;
      if (drag.el.classList.contains("filed")) { const id = drag.el.dataset.id; pst(id).inBox = false; drag.el.classList.remove("filed"); }
      drag.el.classList.remove("moving", "nudge"); drag.el.classList.add("held");
      try { drag.el.setPointerCapture(ev.pointerId); } catch (err) { /* capture is optional */ }
      FX.play(drag.el.classList.contains("sticker") ? "tap" : "lift");
      if (drag.el.classList.contains("paper")) markHandled();
    }
    moveTo(drag.el, drag.ox + dx, drag.oy + dy);
    if (drag.el.classList.contains("paper")) checkLamp();
    const ct = $("#counter"), isCase = drag.el.classList.contains("p-case"), fb = $("#filebox");
    if (ct && drag.el.classList.contains("paper") && !isCase && !drag.el.classList.contains("p-record")) {
      const r = rectOf(ct); ct.classList.add("show-hint"); ct.classList.toggle("ready", ev.clientY < r.bottom && ev.clientY > r.top - 40);
    }
    if (fb && isCase) fb.classList.toggle("hot", inside(rectOf(fb), ev.clientX, ev.clientY));
  });
  function endDrag(ev) {
    if (pending && (!ev || ev.pointerId === pending.id)) {
      // a tap on a stamp lifts it; the next tap on a paper stamps it there
      const p = pending; pending = null;
      if (ev && ev.type === "pointerup") pickUp(p.kind, "armed");
      return;
    }
    if (held && held.mode === "drag" && !held.busy) { if (held.over) stampDown(); else springBack(); return; }
    if (sheetDrag) {
      const d = sheetDrag; sheetDrag = null;
      if (!d.moved) return;
      swallowClick = true;
      d.sheet.classList.remove("held-page");
      finishSheet(d.id, d.sheet, 1, d.p > 0.5);
      return;
    }
    if (pageDrag) {
      const d = pageDrag; pageDrag = null;
      if (!d.moved) return;
      swallowClick = true;
      d.leaf.classList.remove("held-page");
      setLeaf(d.p > 0.5 ? 1 - d.from : d.from, true);
      return;
    }
    if (drawerDrag) {
      if (drawerDrag.moved) { setDrawer(ui.drawer > 0.4 ? 1 : 0); setTimeout(() => { drawerDrag = null; }, 0); } else drawerDrag = null;
      return;
    }
    if (perfDrag) { perfDrag = null; return; }
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved) return;
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    d.el.classList.remove("held");
    const tilt = +(Math.random() * 6 - 3).toFixed(1);
    d.el.style.setProperty("--tilt", tilt + "deg");
    const ct = $("#counter"), fb = $("#filebox");
    if (ct) ct.classList.remove("show-hint");
    if (fb && fb.classList.contains("hot")) { fb.classList.remove("hot"); fileBack(d.el.dataset.id); return; }
    checkLamp();
    if (d.el.classList.contains("paper")) {
      pst(d.el.dataset.id).tilt = tilt;
      if (ct && ct.classList.contains("ready")) { ct.classList.remove("ready"); putAway(d.el.dataset.id, { x: d.ox, y: Math.max(d.oy, TOP) }); return; }
    }
    if (ct) ct.classList.remove("ready");
    FX.play(d.el.classList.contains("sticker") ? "tap" : "settle");
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  document.addEventListener("dragstart", (ev) => { if (ev.target.closest && ev.target.closest("[data-drag], .stamp-btn, [data-stamp-root]")) ev.preventDefault(); });

  document.addEventListener("keydown", (ev) => {
    if (ui.contactOpen) {
      if (ev.key === "Escape") { ev.preventDefault(); if (!closeBrowser()) closeContact(); return; }
      if (ev.target.matches && ev.target.matches("#cm-subject, #cm-msg") && !ev.ctrlKey && !ev.metaKey) {
        const k = keyName(ev);
        if (k) { typeSound(k); pressKey(k); }
      }
      if (ev.key === "Tab") {
        const f = $$("#contact a[href], #contact button, #contact input, #contact textarea").filter((e) => e.offsetParent);
        const i = f.indexOf(document.activeElement);
        if (ev.shiftKey && (i <= 0)) { ev.preventDefault(); f[f.length - 1].focus(); }
        else if (!ev.shiftKey && i === f.length - 1) { ev.preventDefault(); f[0].focus(); }
      }
      return;
    }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("#slip.loose")) { ev.preventDefault(); openContact(ev.target); return; }
    const t = ev.target, typing = t.closest && t.closest(".f, input, textarea, [contenteditable]");
    if (ev.key === "Enter" && t.closest && t.closest(".f")) ev.preventDefault();
    if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const sbtn = t.closest && t.closest(".stamp-btn");
    if (sbtn) {
      // keyboard stamping: Enter picks up and stamps, arrows move, B jumps to the stamp box, Escape puts it back
      const mine = held && held.btn === sbtn;
      if (ev.key === "Enter" || ev.key === " ") {
        ev.preventDefault();
        if (!mine) { pickUp(sbtn.dataset.kind, "key"); return; }
        if (!held.busy) { held.over = stampableAt(held.fx, held.fy); stampDown(); }
        return;
      }
      if (mine && !held.busy) {
        const big = ev.shiftKey ? 48 : 12, step = { ArrowLeft: [-big, 0], ArrowRight: [big, 0], ArrowUp: [0, -big], ArrowDown: [0, big] }[ev.key];
        if (step) { ev.preventDefault(); placeHeld(held.fx + step[0], held.fy + step[1]); return; }
        if (ev.key === "b" || ev.key === "B") {
          ev.preventDefault();
          const s = stampables()[0];
          if (s) { const b = rectOf($(".stamp-box", s)); placeHeld(b.left + b.width / 2, b.top + b.height / 2, true); $("#stamp-status").textContent = "Over the stamp box. Press Enter to stamp."; }
          return;
        }
        if (ev.key === "Escape") { ev.preventDefault(); springBack(); $("#stamp-status").textContent = "Stamp put back."; return; }
      }
    }
    if (ev.key === "Escape" && !held && $("#stampbar").classList.contains("out") && document.activeElement && document.activeElement.closest("#stampdock")) { toggleTray(false); return; }
    if ((ev.key === "s" || ev.key === "S") && !typing && !held && (ui.view === "desk" || $("#intro")) && !editing) { ev.preventDefault(); toggleTray(); return; }
    if (ev.key === "Escape") {
      if (held) { springBack(); return; }

      if ($("#intro")) { closeIntro(); return; }
      if (ui.drawer > 0.5) { setDrawer(0); $("#handle").focus(); return; }
      const open = paperIds().filter((id) => pst(id).open);
      const which = open.includes(ui.front) ? ui.front : open[open.length - 1];
      if (which) closeCase(which);
      return;
    }
    const k = ev.key.toLowerCase(), root = t.closest && t.closest("[data-stamp-root]");
    if ((k === "a" || k === "d") && root && !editing && !held && (root.id !== "passport" || root.classList.contains("open")) && (root.id !== "receipt" || ui.printed)) {
      ev.preventDefault();
      if (root.id === "passport" && ui.passPage !== 0) flipPass();
      stampOnto(root, k === "a" ? "approved" : "denied");
      return;
    }
    const el = t.closest && t.closest("[data-drag]");
    if (!el || el !== t || isPhone()) return;
    if ((ev.key === "Enter" || ev.key === " ") && el.matches(".p-case:not(.open)")) { ev.preventDefault(); if (pst(el.dataset.id).inBox) takeOut(el.dataset.id); else openCase(el.dataset.id); return; }
    if ((ev.key === "b" || ev.key === "B") && el.matches(".p-case")) { ev.preventDefault(); fileBack(el.dataset.id); return; }
    const step = { ArrowLeft: [-24, 0], ArrowRight: [24, 0], ArrowUp: [0, -24], ArrowDown: [0, 24] }[ev.key];
    if (step) { ev.preventDefault(); markHandled(); raise(el); moveTo(el, el.offsetLeft + step[0], el.offsetTop + step[1]); }
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.closest && ev.target.closest("#contact")) { const a = $("#cm-send"); if (a) a.href = mailto(); }
  });
  app.addEventListener("input", (ev) => {
    const el = ev.target.closest("[data-k]");
    if (!el) return;
    const keys = el.dataset.k.split("."), last = keys.pop();
    const text = el.textContent.replace(/\s+/g, " ").trim();
    at(keys.join("."))[last] = el.hasAttribute("data-list") ? text.split(",").map((s) => s.trim()).filter(Boolean) : text;
    touched(); setOwner();
  });

  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      if (ui.view === "desk" && !editing) { applyScene(); updatePill(); updateBar(); }
      if (held && !held.busy) placeHeld(held.fx, held.fy);
    });
  }, { passive: true });
  let rz = null;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(onResize, 120); });
  narrow.addEventListener("change", () => { if (ui.view === "desk" && !editing) render(); });
  setInterval(() => { const c = $("#clock"); if (c) c.textContent = clock(); }, 20000);

  // ----- saving: the whole page, rebuilt from its own source and the current data -----
  function buildDoc() {
    const lt = "<", sc = "script", block = (id) => lt + sc + ' id="' + id + '">' + $("#" + id).textContent + lt + "/" + sc + ">\n";
    const json = JSON.stringify(state, null, 1).replace(/</g, "\\u003c");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" +
      ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}" +
      "</style></head><body>" +
      "<title>CV Please</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n" +
      '<link rel="stylesheet" href="' + $("#fonts").getAttribute("href") + '" id="fonts">\n' +
      "<style id=\"page-style\">" + $("#page-style").textContent + "</style>\n<div id=\"app\"></div>\n<div id=\"intro-root\"></div>\n<div id=\"fixed-root\"></div>\n" +
      lt + sc + " type=\"application/json\" id=\"cv-data\">" + json + lt + "/" + sc + ">\n" + block("art") + block("sprites") + block("sounds") + block("fx") + block("demos") + block("main") + "</body></html>";
  }
  async function save() {
    if (!artifact || busy || !dirty) return;
    busy = true; note = ""; setOwner();
    try {
      await artifact.publish(buildDoc());
    } catch (err) {
      busy = false;
      const code = err && err.code;
      if (code === "conflict") note = "A newer version was saved first. Reloading it.";
      else if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].includes(code)) {
        canEdit = false; editing = false; state = JSON.parse(ORIGINAL); render(); return;
      }
      else if (code === "too_large") note = "Too much text to save. Shorten something and try again.";
      else if (code === "rate_limited") note = "Saving too often. Wait a moment, then file again.";
      else note = "Could not save. Your edits are still here, so try again.";
      setOwner();
    }
  }

  SPR.installTiles(PX);
  renderFixed();
  render();
  renderIntro();

  (async function () {
    if (!window.claude || !window.claude.use) return;
    const got = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
    artifact = got[0];
    if (!artifact) return;
    canEdit = got[1] ? await got[1].canEdit() : true;
    if (canEdit) setOwner();
  })();
})();
</script>
</body></html>
