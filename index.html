<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>CV Please</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Jacquard+24&family=Jersey+10&family=Kalam:wght@400;700&family=Libre+Caslon+Text:ital@0;1&family=Tiny5&display=swap" id="fonts">
<style id="page-style">/* cursors:start */
/* pixel cursors (16x16 art at 2x); generated by make_cursors.py */
:root { --cur-open: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAs0lEQVR4nO2WSxJAMAxAU+MWNsYlLBzAmR3AwiWMjXPUKkNLf9pKZvTtGjWalwQAf0eE3tC1jbyu120XtriLKvQAqfE2gBku86TE+2EEW1xHN0NuoM79gAczEuA0wcfA2y6Ohd6ApbuVWuWC3oDpAhpBE659vnEdegNYY8w0NqNQyA3cOtw0FanAbwS/N2Fu9MwRfgZ8pyIV/AykxlR7hK+Br3qB3EA5gPcUmP7zYyE3UDgAAkVSHG5TXo4AAAAASUVORK5CYII=") 16 16; }
:root { --cur-closed: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAlklEQVR4nGNgGAWjYBSMdMBIrEIlBen/yPx7D54ykiOODpiIdQCtAMEQgPnk5NGdKOLm1u4M5Iijh8TgDQH0OET3EakAFgIwAAuJAQ8BFnQB9DhHdzm5AJd5gy8E0AGlcQ8DgzYXYIQAzIXm1u5Y8z+1weALAWoDXHEPA4M3BOiVFgY8BEYdQHQuoFadgA4GPARGwSgAAEkFPo5HBnuuAAAAAElFTkSuQmCC") 16 16; }
:root { --cur-point: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAsklEQVR4nGNkIBIoKUj/R+bfe/CUkVi9+AATNQyhBBD0BcznJ4/uRBE3t3ZnYGCgPCQGPARGHTDqABZKDaC0fBj6IYClfCApRAZPCFC7rIeFDKEQGfAQYCRU1sMAujwhANNPqA4ZvCEAA7h8QimAmTvwIQBjEAoJaoFBlwbg5QDMRbB8S+uQgIHBEwK0BrjakIMvBOidFgZfCFAbEOo/DN4QoFdaGLwhgA7Q2wfUAgMeAgAxvVdMQHa+awAAAABJRU5ErkJggg==") 10 1; }
:root { --cur-stamp: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAmklEQVR4nGNkIBEoKUj/xyd/78FTRlLMYyLVAdQGRLsW5vPS2hy86rqbpzAwMBAfEgMeAqMOICnFMjCM5FyADtBDglSfw8CAh8CoAwjGG6FUTwgQShsDHgIsuCRgPhd01afIAqXdDP8ZGHCHxICHwKgDcKYBGHi/+yJNHTD4QyCImTIL1v3FLz/4Q4CQDygFAx4Co2AUjIJRAACYHyO7uu7IpwAAAABJRU5ErkJggg==") 16 22; }
:root { --cur-text: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAhElEQVR4nGNkwAFeP73yH5u4qLQOIzHyxAImUhTTArAQUmBu7Y7Ch/kcXfzk0Z1kOWDAQ4BgfKHHNczn6D4mNe5hYMBDgGAaoHaqRwcDHgKjDhh1wKgDRh0w6oBRB4w6gGB7AFc7AF1++LWICLV+cbWWh1+/AFfrl1DaIBYMeAiMglEAANCbNECfG1BuAAAAAElFTkSuQmCC") 12 14; }
/* cursors:end */
/* Layout: a passport spread opens the visit. Then a booth (applicant at the window, board, nameplate) above a wooden desk, pinned while scrolling builds the booth and unpacks the file. A stamp bar slides in from the right whenever a stampable paper is out. The entry record prints below the desk. A plain list view holds the same content in reading order. */
:root {
  color-scheme: light;
  --paper: #ebe5d4;
  --paper-deep: #dfd7c1;
  --field: #f6f2e6;
  --ink: #22201b;
  --ink-soft: #4a463c;
  --rule: #a99f88;
  --stamp-red: #a23226;
  --red-dark: #74231b;
  --stamp-green: #33654a;
  --green-light: #5f8f72;
  --booth: #4d5144;
  --booth-dark: #2f3329;
  --booth-light: #979d87;
  --cover: #2e4939;
  --cover-edge: #223629;
  --cover-ink: #dcc98e;
  --gold-dark: #a8914f;
  --folder-tan: #d6c08c;
  --folder-tan-deep: #bfa66f;
  --wood-1: #2a2018;
  --wood-2: #3a2c20;
  --wood-3: #5e4631;
  --wood-4: #b08a62;
  --wood-5: #dcbd96;
  --on-desk: #ece6d6;
  --shade: rgba(20, 15, 10, 0.5);
  --pool-1: rgba(220, 201, 142, 0.2);
  --pool-2: rgba(220, 201, 142, 0.12);
  --pool-3: rgba(220, 201, 142, 0.06);
  --mark-ip: #e9bdb2;
  --mark-domain: #bcd8c5;
  --mark-hash: #e8d795;
  --t-display: 40px;
  --t-title: 24px;
  --t-body: 16px;
  --t-body-lg: 17px;
  --t-typed: 14px;
  --t-label: 20px;
  --t-label-sm: 10px;
  --pixel: "Tiny5", ui-monospace, monospace;
  --marker: "Kalam", "Barlow", cursive;
  --hand: "Kalam", "Barlow", cursive;
  --wall: #64614e;
  --marker-blue: #34465a;
  --display: "Jersey 10", "Tiny5", ui-monospace, monospace;
  --typed: "Courier Prime", "Courier New", ui-monospace, monospace;
  --sans: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --px: 3px;
  --lift: 8px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --safe-b: env(safe-area-inset-bottom, 0px);
  --page-w: 400px;
  --page-h: 384px;
  --bar-w: 168px;
}

* { box-sizing: border-box; }
*, *::before, *::after { font-variant-ligatures: none !important; }
body { background: var(--paper); color: var(--ink); font: 400 var(--t-body-lg)/1.55 var(--sans); }
html.locked, html.locked body { overflow: hidden; }
a { color: inherit; text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--stamp-green); outline-offset: 3px; }
.intro :focus-visible, .booth :focus-visible, .stampbar :focus-visible, .pill :focus-visible, .counter :focus-visible, .drawer-front :focus-visible, .unpack-hint :focus-visible { outline-color: var(--cover-ink); }
#hello:focus { outline: none; }
h1, h2, h3, p, ul, dl, dd { margin: 0; }
ul { padding-left: 1.1em; }
.spr { display: block; image-rendering: pixelated; flex: none; -webkit-user-drag: none; user-select: none; }
.passport, .printer-area.printed .receipt { user-select: none; -webkit-user-select: none; }
.scroll-x { overflow-x: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* buttons: one loud, the rest quiet */
.btn-main { padding: 9px 18px 8px; border: 0; border-bottom: 4px solid var(--shade); background: var(--stamp-green); color: var(--on-desk); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.btn-main:active { translate: 0 2px; border-bottom-width: 2px; }
.btn-main:disabled { opacity: 0.5; cursor: default; }
.btn-quiet { padding: 4px 2px; border: 0; background: none; font: 400 var(--t-label)/1 var(--pixel); text-decoration: underline; text-underline-offset: 4px; -webkit-font-smoothing: none; }
.btn-quiet:disabled { opacity: 0.5; cursor: default; }

/* ink stamps with a worn pixel edge */
.ink { position: relative; display: inline-block; padding: 6px 11px 4px; font: 400 var(--t-title)/1 var(--display); rotate: var(--tilt, -3deg); -webkit-font-smoothing: none; }
.ink::before { content: ""; position: absolute; inset: 0; border: var(--px) solid currentColor; -webkit-mask-image: var(--worn); mask-image: var(--worn); -webkit-mask-size: var(--worn-size); mask-size: var(--worn-size); -webkit-mask-position: var(--mx, 0) var(--my, 0); mask-position: var(--mx, 0) var(--my, 0); }
.ink.red { color: var(--stamp-red); }
.ink.green { color: var(--stamp-green); }
.ink small { display: block; margin-top: 2px; font: 700 var(--t-typed)/1.2 var(--typed); }

/* ---------- stamp boxes and marks ---------- */
.stampable { position: relative; }
.stamp-box { display: grid; place-items: center; width: 132px; height: 52px; border: 2px dashed var(--rule); color: var(--ink-soft); font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.marks { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.mark { position: absolute; display: grid; place-items: center; width: 112px; height: 34px; translate: -50% -50%; rotate: var(--tilt, 0deg); padding: 0; font: 400 var(--t-title)/1 var(--display); white-space: nowrap; -webkit-font-smoothing: none; }
.mark small { display: none; }

/* ---------- the stamp bar ---------- */
.stampbar { position: fixed; z-index: 70; right: 0; top: 50%; display: none; width: var(--bar-w); translate: 0 -50%; transform: translateX(100%); transition: transform 0.28s ease-out; }
html.desk-mode .stampbar, html.locked .stampbar { display: block; }
.stampbar.out { transform: translateX(0); }
.bar-tab { position: absolute; right: 100%; top: 50%; translate: 0 -50%; display: flex; align-items: center; justify-content: center; width: 34px; height: 96px; padding: 0; border: var(--px) solid var(--ink); border-right: 0; background: var(--booth); color: var(--on-desk); font: 400 var(--t-label)/1 var(--pixel); writing-mode: vertical-rl; -webkit-font-smoothing: none; }
.bar-rail { display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 14px 10px 10px; background: var(--booth-dark); border: var(--px) solid var(--ink); border-right: 0; box-shadow: inset var(--px) 0 0 var(--booth); }
.rivets { display: flex; justify-content: space-between; width: 100%; padding: 0 4px; }
.rivets i { width: 6px; height: 6px; background: var(--booth-light); box-shadow: 2px 2px 0 var(--ink); }
.stamp-btn { position: relative; padding: 0; border: 0; background: none; outline-offset: 2px; }
.stamp-btn .body { display: block; transition: none; }
.stamp-btn.p1 .body { translate: 0 4px; }
.stamp-btn.p2 .body { translate: 0 8px; }
.stamp-btn .word { position: absolute; display: grid; place-items: center; color: var(--paper); font: 400 var(--t-title)/1 var(--display); text-shadow: 2px 2px 0 var(--ink); pointer-events: none; -webkit-font-smoothing: none; }
.stamp-btn.lined::after { content: ""; position: absolute; inset: -4px; border: 1px solid var(--cover-ink); pointer-events: none; }
.bar-note .touch { display: none; }
.bar-note { width: 100%; padding: 6px 6px 4px; background: var(--paper-deep); color: var(--ink); font: 400 var(--t-label)/1 var(--pixel); text-align: center; -webkit-font-smoothing: none; }

/* ---------- intro: the passport ---------- */
.intro { position: fixed; inset: 0; z-index: 50; overflow: auto; display: grid; place-items: center; background: var(--wood-2) var(--wood-tile); background-size: var(--wood-size); image-rendering: pixelated; color: var(--on-desk); transition: opacity 0.4s ease; padding: 20px calc(var(--bar-w) + 24px) 24px var(--gut-l); }
.intro.leaving { opacity: 0; pointer-events: none; }
.intro-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; perspective: 2200px; }
.intro-say { max-width: 760px; min-height: 2em; font: 400 var(--t-label)/1.2 var(--pixel); text-align: center; -webkit-font-smoothing: none; }
.intro-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 22px; }
.passport { position: relative; width: calc(var(--page-w) * 2); height: var(--page-h); translate: calc(var(--page-w) * -0.5 + var(--dx, 0px)) var(--dy, 0px); transition: translate 0.7s ease; touch-action: none; }
.passport.open { translate: var(--dx, 0px) var(--dy, 0px); cursor: grab; }
.passport.lining, .receipt.lining { transition: translate 0.35s ease-out; }
.passport.dragging, .receipt.dragging { transition: none; cursor: grabbing; }
.passport.gone { translate: -130vw var(--dy, 0px); transition: translate 0.45s ease-in; }
.passport:focus { outline: none; }
.passport:focus-visible { outline: 3px solid var(--cover-ink); outline-offset: 4px; }
.pp-page { position: absolute; left: 50%; top: 0; width: 50%; height: 100%; background: var(--paper-deep); color: var(--ink); box-shadow: var(--px) var(--px) 0 var(--shade); }
.pp-cover { position: absolute; left: 50%; top: 0; z-index: 2; width: 50%; height: 100%; transform-style: preserve-3d; transform-origin: 0 50%; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
.passport.open .pp-cover { transform: rotateY(-180deg); }
.pp-front, .pp-back { position: absolute; inset: 0; backface-visibility: hidden; }
.pp-front { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--cover); border: var(--px) solid var(--cover-edge); color: var(--cover-ink); box-shadow: var(--px) var(--px) 0 var(--shade); cursor: pointer; }
.pp-front b { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.pp-front span { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.pp-back { transform: rotateY(180deg); padding: 14px 16px 12px; background: var(--paper-deep); color: var(--ink); border-right: 2px solid var(--rule); }
.pp-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.pp-head span:last-child { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.pp-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
.pp-photo { align-self: start; border: 2px solid var(--ink); background: var(--paper); }
.fields { display: grid; gap: 3px; align-content: start; }
.fields dt { font: 400 var(--t-title)/0.9 var(--display); color: var(--ink-soft); -webkit-font-smoothing: none; }
.fields dd { font: 700 var(--t-typed)/1.2 var(--typed); overflow-wrap: anywhere; }
.pp-mrz { margin-top: 10px; padding-top: 6px; border-top: 1px dashed var(--rule); font: 700 var(--t-typed)/1.45 var(--typed); white-space: nowrap; overflow: hidden; }
.visa-page { position: relative; height: 100%; padding: 14px 16px; }
.visa-page h2 { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.visa-lines { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; margin-top: 12px; }
.visa-lines dt { font: 400 var(--t-title)/1 var(--display); color: var(--ink-soft); -webkit-font-smoothing: none; }
.visa-lines dd { font: 700 var(--t-typed)/1.3 var(--typed); }
.visa .stamp-box { position: absolute; right: 22px; top: 58%; }
.pp-stamps { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; margin-top: 14px; }

/* page turning */
.corner { position: absolute; right: 0; bottom: 0; z-index: 3; padding: 0; border: 0; background: none; }
.corner .spr { width: 18px; height: 18px; transition: width 0.12s steps(2), height 0.12s steps(2); }
.corner:hover .spr, .corner:focus-visible .spr, .paper:hover > .corner .spr, .pp-page:hover .corner .spr { width: 30px; height: 30px; }
.flip-out { animation: flipout 0.09s steps(2) forwards; }
@keyframes flipout { to { scale: 0.08 1; } }

/* ---------- scene: booth and desk, pinned while scrolling ---------- */
.scene { position: relative; }
.stage { position: sticky; top: 0; display: flex; flex-direction: column; overflow: hidden; }

.booth { position: relative; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "win links side" "plate plate side"; gap: 8px 24px; align-items: start; padding: 10px var(--gut-r) 10px var(--gut-l); background: var(--booth-dark); color: var(--on-desk); border-bottom: var(--px) solid var(--ink); }
.window-wrap { grid-area: win; position: relative; overflow: hidden; width: 294px; border: var(--px) solid var(--ink); background: var(--booth); }
.window { position: relative; height: 186px; overflow: hidden; background: var(--booth-light); }
.window .skyline { position: absolute; left: 0; top: 0; }
.window .applicant { position: absolute; left: 50%; bottom: 6px; translate: -50% 0; }
.window .ledge { position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: var(--wood-3); border-top: var(--px) solid var(--wood-4); }
.board { display: flex; gap: 1px; padding: 4px 3px; background: var(--ink); }
.tile { display: inline-grid; place-items: center; width: 13px; height: 22px; background: var(--booth-dark); color: var(--cover-ink); font: 400 var(--t-label)/1 var(--pixel); background-image: linear-gradient(transparent 10px, var(--ink) 10px 11px, transparent 11px); -webkit-font-smoothing: none; }
.shutter { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: repeating-linear-gradient(var(--booth-light) 0 9px, var(--booth) 9px 12px); border-bottom: 6px solid var(--ink); color: var(--ink); }
.shutter span, .shutter .btn-quiet { padding: 3px 8px; background: var(--paper-deep); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.shutter.up { visibility: hidden; }
.nameplate { grid-area: plate; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; justify-self: start; max-width: 100%; padding: 8px 14px 9px; background: var(--cover-ink); color: var(--ink); border: var(--px) solid var(--ink); box-shadow: inset var(--px) var(--px) 0 var(--wood-5); }
.nameplate h1 { font: 400 var(--t-display)/0.9 var(--display); -webkit-font-smoothing: none; }
.nameplate .tagline { max-width: 60ch; font: 400 var(--t-body)/1.35 var(--sans); }
.booth-main { grid-area: links; min-width: 0; padding-top: 4px; }
.denied-note { margin-top: 10px; max-width: 46ch; font: 400 var(--t-body)/1.4 var(--sans); color: var(--cover-ink); }
.booth-links, .ask { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.ask { margin-top: 12px; }
.bubble { margin-top: 8px; max-width: 56ch; padding: 8px 12px; background: var(--paper); color: var(--ink); font: 400 var(--t-body)/1.45 var(--sans); }
.booth-side { grid-area: side; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; text-align: right; }
.clock { font: 400 var(--t-label)/1 var(--pixel); color: var(--cover-ink); -webkit-font-smoothing: none; }
.radio { display: flex; gap: 8px; align-items: center; }
.aside { position: absolute; right: var(--gut-r); top: calc(100% + 8px); z-index: 30; max-width: 280px; padding: 8px 12px; background: var(--paper); color: var(--ink); font: 400 var(--t-body)/1.45 var(--sans); box-shadow: var(--px) var(--px) 0 var(--shade); pointer-events: none; }
.owner { display: inline-flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.owner .note { font: 400 var(--t-body)/1.3 var(--sans); }

.desk { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--wood-2) var(--wood-tile); background-size: var(--wood-size); image-rendering: pixelated; color: var(--on-desk); }
.counter { position: absolute; z-index: 4; left: 0; right: 0; top: 0; height: 40px; display: flex; gap: 10px; align-items: center; padding: 0 var(--gut-r) 0 var(--gut-l); background: var(--wood-3); border-bottom: var(--px) solid var(--ink); box-shadow: inset 0 var(--px) 0 var(--wood-4); }
.counter.ready { background: var(--wood-4); color: var(--ink); }
.counter-label { font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.put-away { display: flex; gap: 6px; overflow-x: auto; }
.chip { flex: none; padding: 3px 8px 2px; border: 2px solid var(--ink); background: var(--paper-deep); color: var(--ink); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.lamp { position: absolute; z-index: 5; right: 52px; top: 48px; pointer-events: none; }
.lamp .on { display: none; }
.desk.lamp-on .lamp .on { display: block; }
.desk.lamp-on .lamp .off { display: none; }
.pool { position: absolute; z-index: 1; right: 0; top: 150px; display: none; pointer-events: none; }
.desk.lamp-on .pool { display: block; }
.ring { position: absolute; z-index: 1; right: 26%; bottom: 22%; opacity: 0.55; pointer-events: none; }
.sticker { position: absolute; z-index: 3; cursor: grab; touch-action: none; user-select: none; }
.sticker:hover { animation: wiggle 0.14s steps(1); }
@keyframes wiggle { 50% { rotate: 6deg; } }
.envelope { position: absolute; z-index: 2; left: var(--gut-l); top: 64px; transform-origin: 50% 100%; transition: transform 0.4s steps(4), opacity 0.2s linear 0.3s; }
.envelope.folded { transform: translateX(-140%) scaleY(0.25); opacity: 0; }
.env-stamp { position: absolute; left: 22px; bottom: 30px; --tilt: -6deg; background: var(--folder-tan); white-space: nowrap; }
.unpack-hint { position: absolute; z-index: 3; left: var(--gut-l); top: 196px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; max-width: 240px; font: 400 var(--t-body)/1.4 var(--sans); }

/* papers */
.paper { position: absolute; z-index: 10; width: 300px; max-width: calc(100% - 16px); background: var(--paper); color: var(--ink); line-height: 1.45; rotate: var(--tilt, 0deg); box-shadow: var(--px) var(--px) 0 var(--shade); cursor: grab; touch-action: none; user-select: none; image-rendering: auto; transition: rotate 0.12s ease-out, scale 0.12s ease-out, box-shadow 0.12s ease-out; }
.paper.moving { transition: left 0.32s ease-out, top 0.32s ease-out, opacity 0.2s ease-out, scale 0.32s ease-out, rotate 0.12s ease-out; }
.paper.held, .sticker.held { z-index: 900 !important; scale: 1.02; rotate: 0deg; box-shadow: var(--lift) var(--lift) 0 var(--shade); cursor: grabbing; }
.paper.packed { opacity: 0; scale: 0.5; pointer-events: none; visibility: hidden; transition: left 0.3s ease-in, top 0.3s ease-in, opacity 0.2s ease-in 0.1s, scale 0.3s ease-in, visibility 0s linear 0.3s; }
.paper.leaving { translate: 0 -60px; opacity: 0; transition: translate 0.2s ease-in, opacity 0.2s ease-in; }
.paper.away { display: none; }
.paper:focus { outline: none; }
.paper:focus-visible { outline: 3px solid var(--cover-ink); outline-offset: 2px; }
.pad { padding: 12px 52px 14px 16px; }
.doc-title { margin-bottom: 8px; font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }

.p-id { width: 350px; background: var(--paper-deep); border: 2px solid var(--ink); }
.p-id .pad { padding-right: 54px; }
.id-body { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.id-photo { border: 2px solid var(--ink); background: var(--paper); align-self: start; }
.p-diploma { width: 280px; border: 6px double var(--ink); background: var(--field); }
.p-diploma .pad { padding-right: 44px; }
.dip-line { font: 700 var(--t-typed)/1.38 var(--typed); }
.dip-line + .dip-line { margin-top: 5px; }
.dip-line b { font-weight: 700; }
.p-diploma .seal { margin: 0 0 8px; --tilt: -4deg; }
.p-honours { width: 280px; }
.p-honours .pad { padding-right: 16px; }
.honour { padding-block: 6px; border-top: 1px solid var(--rule); font: 400 var(--t-body)/1.4 var(--sans); }
.honour:first-of-type { border-top: 0; padding-top: 0; }
.honour b { font-weight: 600; }
.honour p { color: var(--ink-soft); }

.p-case { width: 250px; padding: 34px 12px 12px; background: var(--folder-tan); border: 2px solid var(--folder-tan-deep); }
.folder-tab { position: absolute; left: var(--tab-x, 8px); top: -24px; height: 24px; max-width: 234px; padding: 3px 10px 0; overflow: hidden; text-overflow: ellipsis; background: var(--folder-tan); border: 2px solid var(--folder-tan-deep); border-bottom: 0; font: 400 var(--t-title)/1 var(--display); white-space: nowrap; -webkit-font-smoothing: none; }
.p-case.hot { border-color: var(--stamp-green); }
.p-case.hot .folder-tab { background: var(--cover-ink); border-color: var(--stamp-green); }
.folder-face { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding-right: 22px; }
.folder-face b { display: block; font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.folder-face .when { font: 700 var(--t-typed)/1.3 var(--typed); }
.p-case .clip { position: absolute; right: -9px; top: 40px; }
.p-case .mini-stamp { margin-top: 8px; --tilt: -4deg; }
.peek { position: absolute; right: 30px; bottom: -22px; z-index: -1; padding: 3px 8px 3px; background: var(--field); border: 2px solid var(--ink); font: 400 var(--t-title)/1 var(--display); translate: 0 -18px; transition: translate 0.12s steps(2); -webkit-font-smoothing: none; }
.p-case:hover .peek, .p-case:focus-visible .peek { translate: 0 0; }
.p-case.open { width: 520px; padding: 0; background: var(--paper); border: 0; display: flex; flex-direction: column; cursor: default; }
.p-case.open .paper-head { cursor: grab; }
.paper-head { display: flex; gap: 10px; align-items: center; padding: 6px 10px 5px 14px; background: var(--folder-tan); border-bottom: 2px solid var(--ink); }
.paper-head h2 { flex: 1; min-width: 0; font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.paper-head .pg { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.paper-head .close { padding: 3px 8px 2px; border: 2px solid var(--ink); background: var(--field); font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.paper-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 36px; cursor: grab; font: 400 var(--t-body)/1.5 var(--sans); }
.case-top { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.case-top > div { flex: 1 1 200px; min-width: 0; }
.case-top h3 { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.case-top .meta { margin-top: 4px; font: 400 var(--t-body)/1.4 var(--sans); color: var(--ink-soft); }
.line { margin-top: 10px; font: 600 var(--t-body-lg)/1.45 var(--sans); }
.points { margin-top: 10px; }
.points li + li { margin-top: 6px; }
.stack { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--rule); font: 400 var(--t-body)/1.6 var(--sans); }
.stack-label { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.stack mark, .sk.hot, .sk.used { background: var(--mark-hash); color: var(--ink); }
.demo-zone { margin-top: 14px; }
.demo-zone .btn-main { font-family: var(--display); }
.demo-box { margin-top: 10px; padding: 12px; border: 2px solid var(--ink); background: var(--field); cursor: auto; user-select: text; }

/* skills drawer: the front always shows, raised above the desk edge */
.drawer { position: absolute; z-index: 6; right: 12px; bottom: 0; width: min(620px, 60%); transform: translateY(var(--drawer-y, 100%)); }
.drawer.sliding { transition: transform 0.24s ease-out; }
.drawer-box { max-height: 52vh; overflow: auto; padding: 12px; background: var(--wood-3); border: var(--px) solid var(--ink); border-top: 0; border-bottom: 0; }
.skills-card { padding: 12px 14px; background: var(--paper); color: var(--ink); }
.skills-card .note { margin-bottom: 8px; font: 700 var(--t-typed)/1.4 var(--typed); color: var(--ink-soft); }
.sk-group + .sk-group { margin-top: 10px; }
.sk-group h3 { font: 400 var(--t-title)/1.2 var(--display); -webkit-font-smoothing: none; }
.sk { margin: 4px 6px 0 0; padding: 1px 6px; border: 1px solid var(--rule); background: none; font: 700 var(--t-typed)/1.5 var(--typed); }
.sk.hot { border-color: var(--ink); }
.drawer-front { display: flex; justify-content: flex-end; padding-right: 14px; align-items: center; height: 46px; padding-left: 14px; background: var(--wood-4); border: var(--px) solid var(--ink); border-bottom: 0; box-shadow: inset 0 var(--px) 0 var(--wood-5), 0 calc(var(--px) * -1) 0 var(--shade); }
.handle { display: flex; gap: 10px; align-items: center; padding: 4px 10px; border: 0; background: none; color: var(--ink); font: 400 var(--t-label)/1 var(--pixel); cursor: ns-resize; touch-action: none; -webkit-font-smoothing: none; }

/* ---------- entry record ---------- */
.record-sec { position: relative; z-index: 1; padding: 56px 0 calc(110px + var(--safe-b)); background: var(--paper); color: var(--ink); }
.record-wrap { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px 48px; max-width: 1080px; margin: 0 auto; padding-left: var(--gut-l); padding-right: calc(var(--gut-r) + var(--bar-w)); }
.record-intro h2 { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.record-intro p { margin-top: 10px; font: 400 var(--t-body)/1.5 var(--sans); color: var(--ink-soft); }
.printer-area { position: relative; }
.printer { position: relative; z-index: 2; display: flex; align-items: center; justify-content: flex-end; gap: 12px; width: 400px; max-width: 100%; height: 64px; padding: 0 14px 12px; background: var(--booth); border: var(--px) solid var(--ink); box-shadow: inset var(--px) var(--px) 0 var(--booth-light); }
.printer::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 8px; height: 6px; background: var(--ink); }
.printer .led { width: 9px; height: 9px; background: var(--rule); }
.printer-area.printed .led { background: var(--green-light); }
.printer .btn-quiet { color: var(--on-desk); }
.receipt { position: relative; z-index: 1; width: 360px; max-width: calc(100% - 40px); max-height: 30px; margin: -8px 0 0 20px; overflow: hidden; background: var(--field); translate: var(--dx, 0px) var(--dy, 0px); }
.printer-area.printed .receipt { max-height: none; overflow: visible; cursor: grab; touch-action: none; box-shadow: var(--px) var(--px) 0 var(--shade); }
.receipt:focus { outline: none; }
.receipt:focus-visible { outline: 3px solid var(--stamp-green); outline-offset: 3px; }
.rec { padding: 18px 18px 16px; font: 700 var(--t-typed)/1.5 var(--typed); }
.rec .r-title { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.rec .r-h { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--rule); font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.rec dl { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 2px 10px; margin-top: 10px; }
.rec dt { font: 400 var(--t-title)/1.05 var(--display); color: var(--ink-soft); -webkit-font-smoothing: none; }
.rec ul { margin-top: 4px; }
.rec .stamp-box { margin: 16px 0 0 auto; }
.perf { position: relative; display: block; width: 100%; height: 22px; padding: 0; border: 0; background: none; cursor: ew-resize; touch-action: none; }
.perf::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 3px; background: repeating-linear-gradient(90deg, var(--rule) 0 6px, transparent 6px 12px); }
.perf::after { content: ""; position: absolute; left: 0; top: 4px; width: calc(var(--tear, 0) * 100%); height: 14px; background: var(--paper); clip-path: polygon(0 50%, 4% 0, 8% 60%, 12% 10%, 16% 70%, 20% 0, 24% 55%, 28% 10%, 32% 65%, 36% 0, 40% 60%, 44% 15%, 48% 70%, 52% 0, 56% 55%, 60% 10%, 64% 65%, 68% 0, 72% 60%, 76% 15%, 80% 70%, 84% 0, 88% 55%, 92% 10%, 96% 60%, 100% 30%, 100% 100%, 0 100%); }
.perf .lab { position: absolute; right: 8px; top: -2px; font: 400 var(--t-title)/1 var(--display); color: var(--ink-soft); -webkit-font-smoothing: none; }
.slip { padding: 14px 18px 18px; background: var(--field); rotate: calc(var(--tear, 0) * 4deg); translate: 0 calc(var(--tear, 0) * 8px); transform-origin: 100% 0; }
.slip .s-title { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.slip .email { display: block; margin-top: 6px; font: 700 var(--t-typed)/1.3 var(--typed); user-select: all; overflow-wrap: anywhere; }
.slip .row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 8px; font: 700 var(--t-typed)/1.3 var(--typed); }
.slip .btn-quiet { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.slip.loose { position: absolute; z-index: 5; width: 360px; max-width: calc(100% - 16px); rotate: var(--tilt, 3deg); translate: none; box-shadow: var(--px) var(--px) 0 var(--shade); cursor: grab; touch-action: none; clip-path: polygon(0 6px, 3% 0, 6% 6px, 9% 0, 12% 6px, 15% 0, 18% 6px, 21% 0, 24% 6px, 27% 0, 30% 6px, 33% 0, 36% 6px, 39% 0, 42% 6px, 45% 0, 48% 6px, 51% 0, 54% 6px, 57% 0, 60% 6px, 63% 0, 66% 6px, 69% 0, 72% 6px, 75% 0, 78% 6px, 81% 0, 84% 6px, 87% 0, 90% 6px, 93% 0, 96% 6px, 100% 0, 100% 100%, 0 100%); padding-top: 18px; }
.slip.loose.held { box-shadow: var(--lift) var(--lift) 0 var(--shade); scale: 1.02; rotate: 0deg; }
.receipt.torn .perf { visibility: hidden; height: 10px; }
.record-sec .foot { max-width: 1080px; margin: 64px auto 0; padding: 22px var(--gut-r) 0 var(--gut-l); border-top: 2px solid var(--ink); font: 700 var(--t-typed)/1.4 var(--typed); color: var(--ink-soft); }

/* ---------- bottom pill nav ---------- */
.pill { position: fixed; z-index: 60; left: 50%; bottom: calc(16px + var(--safe-b)); translate: -50% 0; display: none; gap: 4px; align-items: center; padding: 4px; background: var(--booth-dark); color: var(--on-desk); border: 2px solid var(--ink); border-radius: 999px; box-shadow: var(--px) var(--px) 0 var(--shade); }
html.desk-mode .pill { display: flex; }
html.locked .pill { display: none; }
.pill button { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; }
.pill button:hover { background: var(--booth); }
.pill .area { min-width: 132px; text-align: center; font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }

/* demos keep a code face inside their boxes */
.demo-box, .demo-box input, .demo-box textarea, .demo-box button { font-family: var(--mono); }
.demo-label { margin-bottom: 10px; font: 400 13px/1.5 var(--mono); color: var(--ink-soft); }
.demo-note { margin-top: 8px; font: 400 13px/1.5 var(--mono); color: var(--ink-soft); }
.demo-field { display: block; margin: 10px 0 4px; font: 500 13px/1.4 var(--mono); }
.demo-input, .demo-num { padding: 6px 8px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font: 400 13px/1.4 var(--mono); }
.demo-input { width: 100%; }
.demo-num { width: 5.5em; }
.demo-doc { padding: 8px 10px; background: var(--paper); border: 1px dashed var(--rule); font: 400 13px/1.5 var(--mono); }
.demo-out { margin-top: 12px; font: 400 13px/1.5 var(--mono); }
.demo-out ul, .demo-out p { margin-top: 8px; }
.demo-out .ink { font-family: var(--display); }
.demo-box .btn-quiet { font: 400 13px/1.4 var(--mono); }
.demo-picks { display: flex; flex-wrap: wrap; gap: 8px; }
.demo-pick { padding: 4px 10px; border: 2px solid var(--ink); background: var(--paper); font: 400 13px var(--mono); }
.demo-pick[aria-pressed="true"] { background: var(--ink); color: var(--field); }
.demo-dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin-top: 10px; align-items: center; }
.demo-dl dt { font: 500 13px var(--mono); }
.demo-table { width: 100%; margin-top: 10px; border-collapse: collapse; font: 400 13px/1.5 var(--mono); }
.demo-table th, .demo-table td { padding: 4px 8px 4px 0; border-top: 1px solid var(--rule); text-align: left; vertical-align: top; }
.demo-table td:first-child { overflow-wrap: anywhere; }
.demo-table th { border-top: 0; font: 500 13px var(--mono); }
mark.m-ip { background: var(--mark-ip); }
mark.m-domain { background: var(--mark-domain); }
mark.m-hash { background: var(--mark-hash); }
.demo-table mark { color: var(--ink); padding: 0 2px; }
.ioc-wrap { position: relative; }
.ioc-hl, .ioc-in { width: 100%; margin: 0; padding: 8px 10px; border: 2px solid var(--ink); font: 400 13px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.ioc-hl { position: absolute; inset: 0; overflow: hidden; background: var(--paper); border-color: transparent; color: transparent; }
.ioc-hl mark { color: transparent; }
.ioc-in { position: relative; display: block; min-height: 120px; background: none; color: var(--ink); resize: none; overflow: hidden; }

/* ---------- list view ---------- */
.wrap { max-width: 1080px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }
.top { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; justify-content: space-between; padding-block: 16px; border-bottom: 2px solid var(--ink); }
.top .who { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.top nav { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.top .owner .note { color: var(--stamp-red); }
.hero { position: relative; padding-block: clamp(32px, 7vw, 72px) clamp(28px, 5vw, 56px); }
.hero h1 { font: 400 var(--t-display)/0.95 var(--display); -webkit-font-smoothing: none; }
.hero .tagline { margin-top: 14px; max-width: 34ch; font: 600 var(--t-body)/1.35 var(--sans); text-wrap: balance; }
.hero .summary { margin-top: 18px; max-width: 64ch; color: var(--ink-soft); }
.hero .entry { position: absolute; top: clamp(20px, 5vw, 56px); right: 0; --tilt: 6deg; }
.sec { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px 40px; padding-block: 36px; border-top: 2px dashed var(--rule); }
.sec > header h2 { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.sec > header p { margin-top: 8px; font: 400 var(--t-body)/1.5 var(--sans); color: var(--ink-soft); }
.sec > div { min-width: 0; }
.list h3 { font: 400 var(--t-title)/1.05 var(--display); -webkit-font-smoothing: none; }
.list .case { padding-block: 20px; border-top: 1px solid var(--rule); }
.list .case:first-child { padding-top: 0; border-top: 0; }
.list .meta { margin-top: 4px; font: 400 var(--t-body)/1.5 var(--sans); color: var(--ink-soft); }
.list .case li + li { margin-top: 6px; }
.list .case ul { margin-top: 10px; }
.list .honour { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 2px 14px; padding-block: 10px; font-size: var(--t-body-lg); }
.list .honour .yr { color: var(--ink-soft); }
.skills { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px 20px; }
.skills dt { font: 400 var(--t-title)/1.3 var(--display); -webkit-font-smoothing: none; }
.list .email { font: 600 var(--t-body)/1.3 var(--sans); user-select: all; overflow-wrap: anywhere; }
.list .row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.list .links { margin-top: 8px; }
.plain { padding-left: 1.1em; }
.foot { font: 400 var(--t-body)/1.4 var(--sans); color: var(--ink-soft); }
.list .foot { padding-block: 22px 34px; border-top: 2px solid var(--ink); }

/* amend mode */
.f { display: inline-block; min-width: 3em; padding: 0 4px; background: var(--field); box-shadow: inset 0 -1px 0 var(--ink); cursor: text; }
.f.block { display: block; }
.f:empty::before { content: attr(data-ph); color: var(--ink-soft); }
.mini { margin: 6px 8px 0 0; padding: 2px 8px; border: 1px solid var(--ink); background: none; font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.mini.add { border-style: dashed; }
.edit-row { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 6px; }
.edit-row > .lab { min-width: 150px; font: 400 var(--t-label)/1 var(--pixel); color: var(--ink-soft); -webkit-font-smoothing: none; }
.edit-point { margin-bottom: 12px; }

/* ---------- part 5: compact booth, fitted desk, drag-out stamps, wood under the record ---------- */
html, body { overflow-x: clip; }
html { scrollbar-width: auto; scrollbar-color: var(--wood-4) var(--wood-1); }
html::-webkit-scrollbar { width: 12px; height: 12px; background: var(--wood-1); }
html::-webkit-scrollbar-track { background: var(--wood-1); }
html::-webkit-scrollbar-thumb { background: var(--wood-4); border: 2px solid var(--ink); border-radius: 0; }
html::-webkit-scrollbar-thumb:hover { background: var(--wood-5); }
html::-webkit-scrollbar-button { display: none; }
.paper-body, .drawer-box, .demo-box, .put-away, .intro { scrollbar-width: thin; scrollbar-color: var(--ink-soft) var(--paper-deep); }
.paper-body::-webkit-scrollbar, .drawer-box::-webkit-scrollbar, .demo-box::-webkit-scrollbar, .put-away::-webkit-scrollbar, .intro::-webkit-scrollbar { width: 8px; height: 8px; background: var(--paper-deep); }
.paper-body::-webkit-scrollbar-track, .drawer-box::-webkit-scrollbar-track, .demo-box::-webkit-scrollbar-track, .put-away::-webkit-scrollbar-track, .intro::-webkit-scrollbar-track { background: var(--paper-deep); }
.paper-body::-webkit-scrollbar-thumb, .drawer-box::-webkit-scrollbar-thumb, .demo-box::-webkit-scrollbar-thumb, .put-away::-webkit-scrollbar-thumb, .intro::-webkit-scrollbar-thumb { background: var(--ink-soft); border-radius: 0; }
.paper-body::-webkit-scrollbar-thumb:hover, .drawer-box::-webkit-scrollbar-thumb:hover, .demo-box::-webkit-scrollbar-thumb:hover { background: var(--ink); }
.paper-body::-webkit-scrollbar-button, .drawer-box::-webkit-scrollbar-button, .demo-box::-webkit-scrollbar-button, .put-away::-webkit-scrollbar-button, .intro::-webkit-scrollbar-button { display: none; }

/* booth: about 180px, window on the left, links with the nameplate right under them */
.booth { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "win main side"; gap: 0 22px; padding: 8px var(--gut-r) 8px var(--gut-l); }
.window { height: 132px; }
.window .applicant { top: 6px; bottom: auto; }
.booth-main { grid-area: main; display: flex; flex-direction: column; gap: 12px; padding-top: 2px; }
.plate-row { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.nameplate { display: inline-block; width: fit-content; max-width: 100%; padding: 6px 12px 7px; background: var(--cover-ink); color: var(--ink); border: var(--px) solid var(--ink); box-shadow: inset var(--px) var(--px) 0 var(--wood-5), var(--px) var(--px) 0 var(--shade); }
.nameplate h1 { font: 400 var(--t-display)/0.9 var(--display); -webkit-font-smoothing: none; }
.plate-row .tagline { max-width: 58ch; font: 400 var(--t-body-lg)/1.35 var(--sans); color: var(--on-desk); }
.denied-note { margin-top: 0; }
.ask { margin-top: 0; }

/* the desk content sits in its own layer, so the stamp bar and pill always stay above it */
.stage { isolation: isolate; }
.paper { scale: var(--fit, 1); transform-origin: 0 0; }
.paper.held { scale: calc(var(--fit, 1) * 1.02); }
.paper.packed { scale: calc(var(--fit, 1) * 0.5); }
.p-case.open { scale: 1; width: 560px; }
.p-case.open .paper-body { padding-bottom: 28px; }
.p-case.open.held { scale: 1.02; }

.counter-label { display: none; }

/* the skills drawer: a full-width drawer whose front always shows along the bottom edge */
.drawer { left: 0; right: 0; width: auto; translate: none; }

/* the stamps: slots on the bar, and the one being held */

/* passport cover name in the document face */
.pp-front span { font: 400 var(--t-title)/1 var(--display); -webkit-font-smoothing: none; }
.passport.open { cursor: default; }

/* the entry record sits on the same wood, with a desk edge */
.record-sec { background: var(--wood-2) var(--wood-tile); background-size: var(--wood-size); color: var(--on-desk); border-top: 8px solid var(--wood-3); box-shadow: inset 0 var(--px) 0 var(--wood-4); padding-bottom: calc(120px + var(--safe-b)); }
.record-intro p { color: var(--on-desk); }

.receipt { color: var(--ink); translate: none; }

/* the passport as a book: the right-hand leaf turns around the spine */
.passport { perspective: 1600px; }
.passport:not(.open) .pp-cover { z-index: 5; }
.pp-leaf { position: absolute; left: 50%; top: 0; z-index: 3; width: 50%; height: 100%; transform-origin: 0 50%; transform-style: preserve-3d; transition: transform 0.32s steps(4, end); }
.pp-leaf.turned { transform: rotateY(-180deg); }

.leaf-face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--paper-deep); color: var(--ink); box-shadow: var(--px) var(--px) 0 var(--shade); }

.leaf-back .corner { right: auto; left: 0; }

.leaf-face:hover .corner .spr { width: 30px; height: 30px; }
.corner.fwd, .corner.back { cursor: ew-resize; touch-action: none; }
/* flat shading near the spine while the page is mid-turn, and a hard shadow line on the page beneath */
.leaf-face::after { content: ""; position: absolute; top: 0; bottom: 0; width: 22px; background: var(--shade); opacity: 0; pointer-events: none; }
.leaf-front::after { left: 0; }
.leaf-back::after { right: 0; }
.passport.turning .leaf-face::after { opacity: 0.35; }
.pp-under::before, .pp-back::before { content: ""; position: absolute; top: 0; bottom: 0; z-index: 2; width: 3px; background: var(--ink); opacity: 0; pointer-events: none; }
.pp-under::before { left: 0; }
.pp-back::before { right: 0; }
.passport.turning .pp-under::before, .passport.turning .pp-back::before { opacity: 0.45; }
.pp-under .visa-lines { grid-template-columns: 84px minmax(0, 1fr); }


/* ---------- part 6: file box, printer, record view, lamp, sheet turns ---------- */
.window .applicant { top: auto; bottom: 3px; }
.counter-hint { display: none; }
.counter.show-hint .counter-hint { display: inline; }
.desk .lamp { display: none; }

.filebox { position: absolute; z-index: 2; width: 261px; height: 201px; }
.filebox .box-art { position: absolute; inset: 0; }
.filebox.hot .box-art::after { content: ""; position: absolute; inset: -2px; border: 1px solid var(--cover-ink); pointer-events: none; }
.box-all { position: absolute; left: calc(100% + 6px); bottom: 4px; z-index: 40; padding: 2px 6px; border: 0; background: none; color: var(--on-desk); white-space: nowrap; font: 400 var(--t-label)/1 var(--pixel); text-decoration: underline; text-underline-offset: 3px; -webkit-font-smoothing: none; }
.p-case.filed { width: 236px; height: 26px; padding: 0; rotate: 0deg; scale: 1; border-width: 2px; cursor: pointer; }
.p-case.filed .folder-face, .p-case.filed .mini-stamp, .p-case.filed .clip, .p-case.filed .peek { display: none; }

.printer { position: absolute; z-index: 4; width: 150px; height: 102px; }

@keyframes blink { 50% { background: var(--green-light); } }
.stage:has(.receipt) .printer .led { background: var(--green-light); }

.receipt { max-height: none; margin: 0; overflow: visible; }
.paper.p-record { width: 360px; max-width: none; background: var(--field); scale: var(--rfit, 1); rotate: 0deg; }
.paper.p-record.held { scale: calc(var(--rfit, 1) * 1.02); }
.receipt.feeding { box-shadow: none; transition: none; }
.slip.loose { position: absolute; }

.record-view { position: absolute; inset: 0; background: rgba(20, 15, 10, 0.72); }
.rv-bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 18px; align-items: center; justify-content: space-between; height: 46px; padding: 0 calc(var(--bar-w) + 24px) 0 var(--gut-l); background: var(--wood-3); border-bottom: var(--px) solid var(--ink); color: var(--on-desk); }

.stage > .lamp { position: absolute; z-index: 30; display: block; pointer-events: none; }

.stage.lamp-ready:not(.lamp-off) > .lamp .off { display: none; }
.lamp-switch { position: absolute; left: 144px; top: 183px; width: 24px; height: 18px; padding: 0; border: 0; background: none; pointer-events: auto; cursor: pointer; }

.stage.lamp-ready:not(.lamp-off) .desk .pool { display: block; }
.cup-ring { right: auto; bottom: auto; z-index: 1; }

/* case files: pages filled to the paper's height, and sheets turning over the left edge */
.p-case.open .paper-body { font: 400 var(--t-body)/1.45 var(--sans); padding: 12px 18px 26px; }

.sheets { position: relative; display: flex; flex: 1; min-height: 0; perspective: 1400px; }

.pg-nav { display: inline-flex; gap: 6px; align-items: center; }
.pg-btn { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 2px solid var(--ink); background: var(--field); }

.pg-btn .spr { filter: brightness(0.25); }


/* ---------- part 7: Thea's desk art, printer hand-off, contact screen ---------- */
:root { --sprite-scale: 3; --screen-text: #b9dcae; --fb-hi: #e5cc8e; --fb-folder: #bba167; --fb-ink: #1d1e0f; --fb-shade: #4e3d24; }
.art { image-rendering: pixelated; }

/* layers, back to front: booth, counter strip, desk, lamp, papers, held or open paper, stamp bar, pill */
.desk .lamp { position: absolute; z-index: 8; display: block; pointer-events: none; transition: opacity 0.15s steps(2, end); }

.filebox { width: 162px; height: 138px; }
.box-all { left: 47px; top: 117px; bottom: auto; width: 71px; height: 18px; display: grid; place-items: center; padding: 0; color: var(--fb-ink); font: 400 var(--t-label)/1 var(--pixel); text-decoration: none; }

.p-case.filed { width: 126px; height: 9px; padding: 0; background: var(--fb-folder); border: 0; border-top: 3px solid var(--fb-hi); border-bottom: 3px solid var(--fb-shade); box-shadow: none; }

.printer { width: 102px; height: 102px; z-index: 9; }

@keyframes blink7 { 50% { background: var(--ink); } }
.stage:has(.receipt) .printer .led { background: transparent; }
.feed { position: absolute; left: 30px; bottom: 72px; z-index: 1; width: 42px; height: var(--feed, 0px); background: repeating-linear-gradient(to bottom, var(--field) 0 6px, var(--rule) 6px 9px, var(--field) 9px 12px); border: 3px solid var(--fb-ink); border-bottom: 0; pointer-events: none; }

.envelope { z-index: 2; }
.env-stamp { position: absolute; left: 69px; top: 114px; bottom: auto; width: 66px; height: 24px; display: grid; place-items: center; padding: 0; color: var(--stamp-red); background: none; font: 400 var(--t-label)/1.1 var(--pixel); text-align: center; rotate: -3deg; -webkit-font-smoothing: none; }
.unpack-hint { top: 72px; }

/* the record section */
.record-area { position: relative; min-height: 420px; }

.slip.loose { cursor: pointer; }

/* the contact screen */
.contact { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; }
.cm-back { position: absolute; inset: 0; background: rgba(20, 15, 10, 0.62); }

.cm-screen { position: absolute; overflow: hidden; }

.cm-title { margin-bottom: 4px; font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.cm-row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 6px; }

.cm-row .cm-in { flex: 1; min-width: 0; width: auto; }
.cm-btn, .cm-mark, .cm-big { display: inline-block; padding: 3px 8px 2px; border: 1px solid var(--screen-text); background: none; color: var(--screen-text); font: 400 var(--t-label)/1.3 var(--pixel); text-decoration: none; -webkit-font-smoothing: none; }
.cm-send { background: var(--screen-text); color: var(--ink); }
.cm-mark::before { content: "> "; }
.cm-note { font: 400 var(--t-label)/1.3 var(--pixel); }
.cm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.cm-big { display: grid; place-items: center; min-height: 40px; padding: 4px; text-align: center; }
.contact :focus-visible { outline: 2px solid var(--screen-text); outline-offset: 2px; }
.cm-x { position: absolute; z-index: 2; display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 2px solid var(--ink); background: var(--paper-deep); color: var(--ink); font: 400 var(--t-label)/1 var(--pixel); }
.cm-x:focus-visible { outline: 3px solid var(--cover-ink); }


/* ---------- part 8: bigger computer, typing keys, browser, desk fixes, stamp tray ---------- */
:root { --bar-w: 0px; --crt: #37432f; --scan: rgba(0, 0, 0, 0.06); --key-bed: #2c2e1e; --key-cap: #e0cda2; --key-edge: #a0926b; --key-down: #c5b286; }

/* the screen: a flat panel over the sprite's glass, a faint glare on top, and scanlines */
.cm-screen { background: var(--crt); box-shadow: inset 0 0 0 3px var(--fb-ink); }
.cm-screen::before { content: ""; position: absolute; z-index: 3; right: 5%; top: 6%; width: 9%; height: 5%; background: var(--field); opacity: 0.15; pointer-events: none; }
.cm-screen::after { content: ""; position: absolute; inset: 0; z-index: 4; background: repeating-linear-gradient(to bottom, var(--scan) 0 1px, transparent 1px 3px); pointer-events: none; }
.cm-content { padding: 14px 18px; font: 700 var(--t-typed)/1.35 var(--typed); }
.cm-title, .cm-lab, .cm-btn, .cm-note { font-size: var(--t-label); line-height: 1.1; }
.cm-title { margin-bottom: 8px; }
.cm-row { margin-top: 10px; gap: 6px 12px; }
.cm-val { font: 700 var(--t-typed)/1.3 var(--typed); }
.cm-in { padding: 4px 6px; font: 700 var(--t-typed)/1.35 var(--typed); }
.cm-btn { padding: 4px 10px 3px; }

/* the keyboard: keys drawn over the sprite's flat keys so they can go down */
.cm-keys { position: absolute; background: var(--key-bed); }
.cm-key { position: absolute; background: var(--key-cap); box-shadow: inset 0 calc(var(--ks) * -1) 0 var(--key-edge); cursor: pointer; }
.cm-key.down { transform: translateY(var(--ks)); box-shadow: none; background: var(--key-down); }
.cm-key.gone { display: none; }

/* the browser on the screen */
.cm-browser { display: flex; flex-direction: column; gap: 8px; height: 100%; }
.cm-browser[hidden] { display: none; }
.br-title { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 10px; background: var(--paper-deep); color: var(--ink); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.br-x { display: grid; place-items: center; width: 26px; height: 24px; padding: 0; border: 2px solid var(--ink); background: var(--field); color: var(--ink); font: 400 var(--t-label)/1 var(--pixel); }
.br-nav { display: flex; gap: 6px; align-items: center; }
.br-arrow { display: grid; place-items: center; width: 30px; height: 28px; padding: 0; border: 2px solid var(--screen-text); background: none; }
.br-arrow:disabled { opacity: 0.45; }
.br-addr { flex: 1; min-width: 0; height: 28px; padding: 3px 8px; overflow: hidden; border: 2px solid var(--screen-text); color: var(--screen-text); font: 700 var(--t-typed)/1.2 var(--typed); white-space: nowrap; }
.br-search { opacity: 0.7; }
.br-load { height: 6px; background: transparent; }
.br-load i { display: block; width: 0; height: 100%; background: var(--screen-text); }
.br-load.go i { animation: brload 0.45s steps(6, end) forwards; }
.br-load.done i { width: 100%; }
@keyframes brload { to { width: 100%; } }
.br-tiles { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 12px 14px; flex: 1; }
.br-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 112px; padding: 4px 2px; border: 0; background: none; color: var(--screen-text); text-decoration: none; cursor: pointer; }
.br-circle { display: grid; place-items: center; width: 64px; height: 64px; border: 3px solid var(--fb-ink); border-radius: 50%; background: var(--paper-deep); }
.br-tile:hover .br-circle, .br-tile:focus-visible .br-circle { background: var(--field); }
.br-label { font: 400 var(--t-body)/1.25 var(--sans); text-align: center; }
.br-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
.br-grid .br-tile { width: auto; }
.br-grid .br-circle { width: 44px; height: 44px; }
.br-grid .br-label { font-size: var(--t-body); }

/* the desk: lamp pinned to the top-right corner, light just below and left of its shade */
.desk .lamp { left: auto !important; right: 0; top: 0 !important; }
.desk .pool { right: 120px; top: 90px; }
.filebox { width: 300px; height: 210px; }
.box-all { left: 84px; top: 189px; width: 132px; height: 18px; color: var(--fb-ink); font: 400 var(--t-title)/18px var(--display); -webkit-font-smoothing: none; }
.p-case.filed { width: 264px; height: 9px; }
.p-case.filed .folder-tab { top: -22px; height: 22px; max-width: 264px; padding: 3px 8px 0; font: 400 var(--t-title)/1 var(--display); }
.record-sec { padding-bottom: calc(240px + var(--safe-b)); }
.record-area { min-height: 300px; }

/* the bottom group: [Stamps] [< Area >], centred; the tray opens upward from the Stamps pill */
.pills { position: fixed; z-index: 75; left: 50%; bottom: calc(16px + var(--safe-b)); translate: -50% 0; display: none; gap: 8px; align-items: flex-end; }
html.desk-mode .pills, html.locked .pills { display: flex; }
.pills .pill { position: relative; left: auto; bottom: auto; translate: none; display: flex; z-index: auto; }
.pills.solo .pill { display: none; }
.pill.below { translate: 0 calc(100% + 24px + var(--safe-b)); }
.pill.rising { transition: translate 0.25s ease-out; }
.stamp-dock { position: relative; display: block; }
.stamp-dock.sliding { transition: translate 0.3s ease-out; }
.stamp-handle { display: flex; gap: 10px; align-items: center; height: 48px; padding: 4px 18px 4px 16px; background: var(--booth-dark); color: var(--on-desk); border: 2px solid var(--ink); border-radius: 999px; box-shadow: var(--px) var(--px) 0 var(--shade); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.stamp-handle:hover { background: var(--booth); }
.stamp-handle:focus-visible { outline: 3px solid var(--cover-ink); outline-offset: 2px; }
.stamp-handle .caret { display: grid; }
.stamp-handle .caret .spr { grid-area: 1 / 1; }

}

/* ---------- part 9: shadows that follow each object's outline ---------- */
:root { --shade-rest: rgba(20, 15, 10, 0.45); --shade-lift: rgba(20, 15, 10, 0.35); --rest-shadow: drop-shadow(2px 3px 1px var(--shade-rest)); --lift-shadow: drop-shadow(6px 10px 3px var(--shade-lift));
  --shape-ring: drop-shadow(2px 0 0 var(--cover-ink)) drop-shadow(-2px 0 0 var(--cover-ink)) drop-shadow(0 2px 0 var(--cover-ink)) drop-shadow(0 -2px 0 var(--cover-ink)); }

.sticker:hover .art { filter: var(--shape-ring) var(--rest-shadow); }

/* the file box: box, folders in their slots, and the front edge on top */
.filebox { width: 240px; height: 252px; cursor: pointer; }

.desk:has(.box-plate:hover) .filebox .art, .desk:has(.box-plate:focus-visible) .filebox .art, .desk:has(.box-plate:hover) .filebox-front .art, .desk:has(.box-plate:focus-visible) .filebox-front .art,
.filebox:hover .art, .desk:has(.filebox:hover) .filebox-front .art, .filebox.hot .art, .desk:has(.filebox.hot) .filebox-front .art { filter: var(--shape-ring) var(--rest-shadow); }

/* sound toggle as an icon */

/* the stamp tray lets the desk show through a little */
:root { --tray-bg: rgba(47, 51, 41, 0.82); --power-hi: #c4483a; }

.cm-power::before { content: ""; position: absolute; left: calc(50% - var(--led) / 2); top: calc(50% - var(--led) / 2); width: var(--led); height: var(--led); background: transparent; }

.cm-power .tip { position: absolute; left: 50%; bottom: calc(100% + 6px); translate: -50% 0; display: none; padding: 3px 6px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); font: 400 var(--t-label)/1 var(--pixel); white-space: nowrap; -webkit-font-smoothing: none; }

/* part 9 type: field labels are Tiny5 at 10px; 4px label to value, 12px between fields, 20px between sections */

/* ---------- part 9: two drawers, Skills and Personal ---------- */
.desk-edge { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; height: 68px; background: var(--wood-4); border-top: var(--px) solid var(--ink); box-shadow: inset 0 var(--px) 0 var(--wood-5), 0 calc(var(--px) * -1) 0 var(--shade); }

.dw-plate { position: absolute; left: calc(92px * var(--sprite-scale)); top: calc(4px * var(--sprite-scale)); width: calc(26px * var(--sprite-scale)); height: calc(5px * var(--sprite-scale)); display: grid; place-items: center; translate: 0 -3px; color: var(--ink); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }

/* Thea's things in the Personal drawer, and out on the desk */
.pobj { position: absolute; display: block; width: calc(var(--aw) * var(--sprite-scale) * 1px); height: calc(var(--ah) * var(--sprite-scale) * 1px); cursor: grab; touch-action: none; user-select: none; }

@keyframes wobble { 0% { translate: 0 0; } 50% { translate: 3px 0; } 100% { translate: 0 0; } }
.pnote { position: absolute; z-index: 700; max-width: 240px; padding: 14px 14px 12px; background: var(--paper); color: var(--ink); rotate: -2deg; font: 400 var(--t-body)/1.4 var(--sans); filter: var(--rest-shadow); pointer-events: none;
  clip-path: polygon(0 4px, 8% 0, 16% 4px, 24% 0, 32% 4px, 40% 0, 48% 4px, 56% 0, 64% 4px, 72% 0, 80% 4px, 88% 0, 96% 4px, 100% 0, 100% 100%, 0 100%); }
.sk-view { position: absolute; z-index: 800; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: rgba(20, 15, 10, 0.55); }
.sk-book { position: relative; }

/* slow time: the desk dims a touch and the lamp pool warms one step */

/* ---------- part 9: pins, booth details, ink pads, the visitor note ---------- */
.honour.pinned { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 10px; align-items: start; }

.pin:focus-visible { outline: none; }

.list .honour.pinned { grid-template-columns: 56px 66px minmax(0, 1fr); }

.skyline { display: block; transition: opacity 0.3s steps(2, end); }

.ic-btn:focus-visible { outline: 2px solid var(--cover-ink); outline-offset: 1px; }
.ic-btn .tip { position: absolute; right: calc(100% + 4px); top: 4px; display: none; padding: 3px 6px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); font: 400 var(--t-label)/1 var(--pixel); white-space: nowrap; -webkit-font-smoothing: none; }
.ic-btn:hover .tip, .ic-btn:focus-visible .tip { display: block; }
.pinboard { position: absolute; right: 112px; top: 14px; display: none; line-height: 0; }
.pinboard > .art { filter: var(--rest-shadow); }
.pb-map { position: absolute; left: 36px; top: 21px; line-height: 0; }
.pb-map .art { filter: drop-shadow(1px 2px 0 var(--shade-rest)); }
.pb-pin { position: absolute; left: 48px; top: -3px; width: 9px; height: 9px; background: var(--stamp-red); box-shadow: inset -3px -3px 0 var(--red-dark), 2px 2px 0 var(--shade-rest); }
.pb-scrap { position: absolute; left: 168px; top: 30px; width: 168px; padding: 10px 12px 9px; background: var(--paper); color: var(--ink); rotate: 3deg; font: 400 var(--t-body)/1.3 var(--sans); filter: var(--rest-shadow);
  clip-path: polygon(0 3px, 10% 0, 20% 3px, 30% 0, 40% 3px, 50% 0, 60% 3px, 70% 0, 80% 3px, 90% 0, 100% 3px, 100% 100%, 0 100%); }
.pb-scrap:empty { display: none; }
@media (min-width: 1360px) { .pinboard { display: block; } }

.stamp-dock .stamp-btn { width: 144px; height: 106px; }
.stamp-btn .inkpad { position: absolute; left: 0; bottom: 0; line-height: 0; }
.stamp-btn .inkpad .art { width: 144px; height: 90px; filter: drop-shadow(1px 2px 0 var(--shade-rest)); }
.stamp-btn .stamp-art { position: absolute; left: 8px; top: 0; }
.stamp-btn.empty { background: none; box-shadow: none; }
.stamp-btn.empty .inkpad { visibility: visible; }

.notepad { position: absolute; z-index: 4; padding: 0; border: 0; background: none; line-height: 0; cursor: pointer; }
.notepad .art { filter: var(--rest-shadow); transition: filter 0.12s ease-out; }
.notepad:hover .art, .notepad:focus-visible .art { filter: var(--shape-ring) var(--rest-shadow); }
.notepad:focus-visible { outline: none; }
.vnote { position: absolute; z-index: 800; width: 280px; padding: 16px 16px 12px; background: var(--folder-tan); color: var(--ink); filter: var(--rest-shadow); rotate: -1deg; }

@keyframes peel { 0% { rotate: -8deg; translate: 0 12px; } 100% { rotate: -1deg; translate: 0 0; } }
.vnote textarea { display: block; width: 100%; resize: none; padding: 0; border: 0; border-bottom: 1px dashed var(--ink-soft); background: transparent; color: var(--ink); font: 400 var(--t-body)/1.45 var(--sans); }
.vnote textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.vn-count { margin: 6px 0 10px; color: var(--ink-soft); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.vn-row { display: flex; gap: 16px; align-items: center; }
.vn-row .btn-main { text-decoration: none; }
.vn-row .btn-main.off { opacity: 0.55; cursor: default; }

.vsent { position: absolute; z-index: 6; right: 24px; bottom: 12px; display: flex; gap: 10px; align-items: center; max-width: 260px; padding: 8px 12px; background: var(--folder-tan); color: var(--ink); rotate: -2deg; filter: var(--rest-shadow); font: 400 var(--t-body)/1.3 var(--sans); }
.vs-tag { color: var(--stamp-red); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }

/* ---------- part 9: motion, idle details, cursors, easter eggs ---------- */
:root { --skin: #c9ac85; }
/* hovering a paper lifts its top-right corner one art pixel, with more shadow under it */
.paper::before { content: ""; position: absolute; z-index: 6; top: 0; right: 0; width: 18px; height: 18px; background: inherit; pointer-events: none; opacity: 0; transition: opacity 0.12s steps(2, end), translate 0.12s steps(2, end), filter 0.12s steps(2, end); }
.paper:not(.filed):not(.held):not(.packed):hover::before { opacity: 1; translate: 3px -3px; filter: drop-shadow(-1px 3px 1px var(--shade-rest)); }
.p-case.filed::before { display: none; }
/* the first visit: the box and drawers slide in last */
.arriving { transition: translate 0.3s ease-out, opacity 0.3s steps(3, end); }
.arriving.hold { translate: 0 60px; opacity: 0; }

/* mug steam, two frames */

.steam.f1, .steam.f2 { display: block; }

.steam.f1 .spr:last-child, .steam.f2 .spr:first-child { visibility: hidden; }
/* a blink at the booth window: eye pixels of the portrait, drawn at 2x */
.window .blink { position: absolute; z-index: 1; left: 36%; bottom: 3px; width: 110px; height: 118px; translate: -50% 0; visibility: hidden; pointer-events: none; }
.window .blink.on { visibility: visible; }
.window .blink i { position: absolute; top: 44px; height: 4px; background: var(--skin); box-shadow: inset 0 -2px 0 var(--ink); }
.window .blink i:first-child { left: 40px; width: 10px; }
.window .blink i:last-child { left: 62px; width: 8px; }
/* easter eggs */
.really { position: absolute; left: 100%; top: -10px; margin-left: 8px; color: var(--ink); rotate: 6deg; font: 400 var(--t-body)/1 var(--sans); font-style: italic; white-space: nowrap; }
.refill { position: absolute; z-index: 700; padding: 8px 12px; background: var(--folder-tan); color: var(--ink); rotate: -4deg; filter: var(--rest-shadow); font: 400 var(--t-label)/1 var(--pixel); -webkit-font-smoothing: none; }
.cm-sudo { margin: 0 0 6px; color: var(--screen-text); font: 400 var(--t-label)/1.2 var(--pixel); -webkit-font-smoothing: none; }
.stamp-btn.eager .stamp-art { translate: 0 -8px; transition: translate 0.15s ease-out; }
.stamp-box.ghost { position: absolute; right: 16px; bottom: 16px; width: 150px; height: 60px; visibility: hidden; }
.p-id .pad.stampable { position: relative; }

/* pixel cursors on mouse and trackpad; touch keeps the system ones */
@media (pointer: fine) {
  .paper[data-drag], .sticker, .pobj, .stamp-btn, #slip.loose, .printer-area.printed .receipt { cursor: var(--cur-open), grab; }
  .paper.held, .sticker.held, .pobj.held, .receipt.dragging, .passport.dragging { cursor: var(--cur-closed), grabbing; }
  button, a, [role="button"]:not(.pobj), .folder-tab, .dw-front, .pin, .notepad, .ic-btn, .cm-power, .filebox, .box-plate, .cm-key, .br-tile { cursor: var(--cur-point), pointer; }
  input, textarea, .f, [contenteditable="true"] { cursor: var(--cur-text), text; }

}

/* ---------- part 10: two rooms side by side; the camera pans between them ---------- */
@media (min-width: 821px) {
  html.desk-mode, html.desk-mode body { height: 100%; overflow: hidden; }
  html.desk-mode .site { position: fixed; inset: 0; overflow: hidden; }
  .rooms { display: flex; width: 200vw; height: 100svh; translate: calc(var(--room, 0) * -100vw) 0; transition: translate 0.45s ease-in-out; }
  .rooms.fading { animation: room-fade 0.18s steps(3, end); }
  .room { position: relative; flex: 0 0 100vw; width: 100vw; height: 100svh; overflow: clip; }
  .room-pan { position: relative; transition: translate 0.25s ease-out; translate: 0 calc(var(--pan, 0px) * -1); }
  .scene .stage { position: relative; top: auto; }
  .floor { position: relative; height: 1600px; background: var(--wood-1); box-shadow: inset 0 10px 8px -6px var(--shade); }
}
@media (min-width: 821px) and (prefers-reduced-motion: reduce) { .rooms, .room-pan { transition: none; } }
@keyframes room-fade { 0% { opacity: 0.2; } 100% { opacity: 1; } }
.feed.torn { transition: transform 0.38s ease-in; transform: translateX(110vw); }

/* ---------- part 10: drawers pull down toward the visitor ---------- */
.dw { clip-path: inset(var(--hide, 420px) var(--crop, 0px) 0 var(--crop, 0px)); }

    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.16, at + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.07);
    o.connect(lp); lp.connect(g); g.connect(snd.gain); o.start(at); o.stop(at + 0.08);
  }
  // a soft scan: a quiet shutter, a smooth light sweep rising as the bar travels, then a gentle two-note "done"
  function scanSound(c) {
    const t0 = c.currentTime, out = c.createGain(), lp = c.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 3200; out.gain.value = 0.6; lp.connect(out); out.connect(snd.gain);
    tick(c, 0.008, 4200, 0.25);
    // the sweep: two soft sines a fifth apart gliding up, with a light shimmer
    [[1, 0.07], [1.5, 0.035]].forEach((h) => {
      const o = c.createOscillator(), g = c.createGain(), at = t0 + 0.06, len = 0.6;
      o.type = "sine"; o.frequency.setValueAtTime(330 * h[0], at); o.frequency.exponentialRampToValueAtTime(660 * h[0], at + len);
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 14; lg.gain.value = h[1] * 0.35; lfo.connect(lg); lg.connect(g.gain);
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(h[1], at + 0.08); g.gain.setValueAtTime(h[1], at + len - 0.1); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      o.connect(g); g.connect(lp); o.start(at); o.stop(at + len + 0.02); lfo.start(at); lfo.stop(at + len + 0.02);
    });
    // done: two round notes
    [[784, 0.68], [1175, 0.8]].forEach((n) => {
      const o = c.createOscillator(), g = c.createGain(), at = t0 + n[1];
      o.type = "triangle"; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.12, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.28);
      o.connect(g); g.connect(lp); o.start(at); o.stop(at + 0.3);
    });
  }
  // the speaker waking up: a soft switch click, then a short low hum (under 300ms)
  function speakerOn(c) {
    const t0 = c.currentTime;
    tick(c, 0.01, 2600, 0.35);
    const o = c.createOscillator(), o2 = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain(), at = t0 + 0.03, len = 0.24;
    o.type = "triangle"; o.frequency.value = 98; o2.type = "sine"; o2.frequency.value = 196;
    lp.type = "lowpass"; lp.frequency.value = 600;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.22, at + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(snd.gain); o.start(at); o2.start(at); o.stop(at + len + 0.02); o2.stop(at + len + 0.02);
  }
  // the tray sliding home: a dull metal knock with a short ring
  function metalClunk(c) {
    const t0 = c.currentTime;
    tick(c, 0.05, 520, 0.6);
    const o = c.createOscillator(), g = c.createGain(), at = t0 + 0.005;
    o.type = "square"; o.frequency.setValueAtTime(150, at); o.frequency.exponentialRampToValueAtTime(110, at + 0.12);
    const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.12, at + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
    o.connect(lp); lp.connect(g); g.connect(snd.gain); o.start(at); o.stop(at + 0.18);
    tick(c, 0.08, 2300, 0.1, t0 + 0.02);
  }
  // felt on a whiteboard: soft filtered noise that rises and falls
  function swish(c, len, vol) {
    const n = Math.floor(c.sampleRate * len), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { const x = i / n; d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * x) * (0.7 + 0.3 * Math.sin(x * 40)); }
    const s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; bp.type = "bandpass"; bp.frequency.value = 1300; bp.Q.value = 0.6; g.gain.value = vol;
    s.connect(bp); bp.connect(g); g.connect(snd.gain); s.start();
  }
  // a booth intercom: the press-to-talk click, a short buzzer through a small speaker, then a breath of line static
  function intercomBuzz(c) {
    const t0 = c.currentTime + 0.005, bus = c.createGain(), hp = c.createBiquadFilter(), lp = c.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 350; lp.type = "lowpass"; lp.frequency.value = 2600;
    bus.gain.value = 0.7; hp.connect(lp); lp.connect(bus); bus.connect(snd.gain);
    tick(c, 0.012, 2000, 0.45, t0);
    // the buzzer: a rough square wave, chopped at mains rate
    const o = c.createOscillator(), g = c.createGain(), am = c.createOscillator(), amg = c.createGain();
    o.type = "square"; o.frequency.value = 330; am.type = "square"; am.frequency.value = 50; amg.gain.value = 0.05;
    am.connect(amg); amg.connect(g.gain);

    g.gain.setValueAtTime(0.0001, a0); g.gain.linearRampToValueAtTime(0.09, a0 + 0.01); g.gain.setValueAtTime(0.09, a0 + len - 0.03); g.gain.linearRampToValueAtTime(0.0001, a0 + len);
    o.connect(g); g.connect(hp); o.start(a0); am.start(a0); o.stop(a0 + len + 0.02); am.stop(a0 + len + 0.02);

    const n = Math.floor(c.sampleRate * 0.22), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { const x = i / n; d[i] = (Math.random() * 2 - 1) * (1 - x) * (Math.random() < 0.04 ? 2.2 : 0.6); }
    const s2 = c.createBufferSource(), sg = c.createGain(); s2.buffer = buf; sg.gain.value = 0.18;
    s2.connect(sg); sg.connect(hp); s2.start(a0 + len + 0.03);
    tick(c, 0.01, 1700, 0.3, a0 + len + 0.26);
  }

  // ----- a little jazz from the speaker: a soft ii-V-I loop with electric piano, walking bass and brushes -----
  // Made in the browser, so it is free to use and costs nothing to download.
  const JAZZ = { bpm: 84, bars: [
    { root: 38, third: 3, chord: [53, 57, 60, 64] },   // Dm9
    { root: 43, third: 4, chord: [53, 59, 64, 69] },   // G13
    { root: 36, third: 4, chord: [52, 55, 59, 62] },   // Cmaj9
    { root: 45, third: 4, chord: [55, 58, 61, 64] },   // A7b9
    { root: 38, third: 3, chord: [53, 57, 60, 65] },   // Dm11
    { root: 43, third: 4, chord: [53, 59, 62, 65] },   // G7
    { root: 36, third: 4, chord: [52, 55, 59, 64] },   // Cmaj7
    { root: 36, third: 4, chord: [50, 55, 59, 64] },   // Cmaj9 turnaround
  ] };
  const music = { on: false, timer: null, next: 0, beat: 0, bus: null };
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function epNote(c, at, m, len, vol) {
    const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = "sine"; o.frequency.value = hz(m); o2.type = "triangle"; o2.frequency.value = hz(m) * 2; o2.detune.value = 4;
    const g2 = c.createGain(); g2.gain.value = 0.25;
    lp.type = "lowpass"; lp.frequency.value = 1800;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(music.bus);
    o.start(at); o2.start(at); o.stop(at + len + 0.05); o2.stop(at + len + 0.05);
  }
  function bassNote(c, at, m, len) {
    const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = "triangle"; o.frequency.value = hz(m); lp.type = "lowpass"; lp.frequency.value = 520;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.28, at + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(lp); lp.connect(g); g.connect(music.bus); o.start(at); o.stop(at + len + 0.05);
  }
  function brush(c, at, vol) {
    const n = Math.floor(c.sampleRate * 0.09), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; bp.type = "bandpass"; bp.frequency.value = 6500; bp.Q.value = 0.8; g.gain.value = vol;
    s.connect(bp); bp.connect(g); g.connect(music.bus); s.start(at);
  }
  // schedule one beat: bass every beat, brushes on the beat and the swung "and" of 2 and 4, piano comping now and then
  function jazzBeat(c, at) {
    const spb = 60 / JAZZ.bpm, bi = Math.floor(music.beat / 4) % JAZZ.bars.length, b = JAZZ.bars[bi], beat = music.beat % 4, nb = JAZZ.bars[(bi + 1) % JAZZ.bars.length];
    const walk = [b.root, b.root + b.third, b.root + 7, nb.root + (Math.random() < 0.5 ? 1 : -1)];
    bassNote(c, at, walk[beat], spb * 0.95);
    brush(c, at, beat % 2 ? 0.05 : 0.035);
    if (beat % 2) brush(c, at + spb * 2 / 3, 0.025);
    if (beat === 0) b.chord.forEach((m, k) => epNote(c, at + k * 0.012, m, spb * 2.2, 0.045));
    if (beat === 1 && Math.random() < 0.6) b.chord.slice(1).forEach((m) => epNote(c, at + spb * 2 / 3, m, spb * 1.1, 0.03));
    if (beat === 3 && Math.random() < 0.35) epNote(c, at + spb * 2 / 3, b.chord[3] + 12, spb * 0.9, 0.025);

  }
  function startMusic() {
    const c = ctx();
    if (!c || music.on) return;
    music.on = true;
    if (!music.bus) { music.bus = c.createGain(); music.bus.gain.value = 0.5; music.bus.connect(snd.gain); }
    music.bus.gain.cancelScheduledValues(c.currentTime); music.bus.gain.setValueAtTime(0.0001, c.currentTime); music.bus.gain.exponentialRampToValueAtTime(0.5, c.currentTime + 1.2);

      const spb = 60 / JAZZ.bpm;

    if (!music.on) return;

  }
  // get the sounds ready straight away, so the walk-in can be heard where the browser allows sound before a click;
  // elsewhere the first click or key wakes the sound up
  if (snd.on) setTimeout(ctx, 0);
  ["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if (snd.on && snd.ctx && snd.ctx.state === "suspended") snd.ctx.resume(); }, true));
  // browsers only let sound start after a click or key, so a remembered "on" waits for the first one
  ["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if (snd.on && !music.on && !document.hidden) startMusic(); }, true));
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopMusic(); else if (snd.on && snd.ctx) startMusic(); });

  function toggle() {
    snd.on = !snd.on;
    if (snd.on) { ctx(); startMusic(); } else stopMusic();
    try { sessionStorage.setItem("cvp-sound", snd.on ? "on" : "off"); } catch (err) { /* storage can be blocked */ }
    return snd.on;
  }

  function board(el, phrases, n) {
    el.innerHTML = Array.from({ length: n }, () => '<span class="tile">&nbsp;</span>').join("");
    const tiles = Array.from(el.children), cur = Array(n).fill(" ");
    let idx = -1, timer = null, running = false, paused = false, gen = 0;
    const list = (phrases || []).filter(Boolean);
    function set(i, c) { tiles[i].textContent = c === " " ? " " : c; cur[i] = c; }
    function show(text, instant) {
      const g = ++gen;
      text = String(text).toUpperCase().slice(0, n).padEnd(n, " ");
      if (instant || reduced()) { for (let i = 0; i < n; i++) set(i, text[i]); next(); return; }
      // two passes, so two phrases are never mixed: every tile clears to blank, then each flips to its own letter
      const lit = [];
      for (let i = 0; i < n; i++) if (cur[i] !== " ") lit.push(i);
      lit.forEach((i, k) => setTimeout(() => { if (g !== gen) return; set(i, " "); play("tick"); }, k * 22));
      const flipAt = lit.length * 22 + 120, todo = [];
      for (let i = 0; i < n; i++) if (text[i] !== " ") todo.push(i);
      todo.forEach((i, k) => setTimeout(() => { if (g !== gen) return; set(i, text[i]); play("tick"); }, flipAt + k * 30));
      setTimeout(() => { if (g === gen) next(); }, flipAt + todo.length * 30 + 20);
    }
    function next() {
      clearTimeout(timer);
      if (!running || !list.length) return;
      timer = setTimeout(() => {
        if (paused) { next(); return; }
        idx = (idx + 1) % list.length;
        show(list[idx]);
      }, idx < 0 ? 0 : 3200);
    }
    el.addEventListener("mouseenter", () => { paused = true; });
    el.addEventListener("mouseleave", () => { paused = false; });
    return {
      start() { if (running) return; running = true; next(); },
      blank() { running = false; clearTimeout(timer); idx = -1; show("", true); },
      get running() { return running; },
    };
  }

  return { play: play, toggle: toggle, board: board, setRate(r) { snd.rate = r; }, get soundOn() { return snd.on; } };
})();
